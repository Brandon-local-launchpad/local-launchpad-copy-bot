        example: 101
        required: true
        schema:
          type: integer
  '/public/api/v1/locations/{id}/performance/queries/table':
    get:
      summary: 'Queries table — the search terms people used'
      operationId: queriesTableTheSearchTermsPeopleUsed
      description: "The individual search terms that surfaced this location, with impression counts and\nperiod-over-period movement. Searching, filtering, sorting and pagination are all\napplied server-side.\n\n**Returns** a flat Laravel paginator: `data[]` alongside `current_page`, `per_page`,\n`total`, `last_page`, `from`, `to`, `links[]` and the `*_page_url` fields at the top\nlevel. There is **no `meta` wrapper**.\n\nEach `data[]` row:\n- `keyword` — the search term. Pass it verbatim to `queries/detail`.\n- `current` / `prior` / `change_pct` — impressions this range vs the equal-length\n  preceding block. `change_pct` is `null` when `prior` is `0`.\n- `is_branded` — the term contains the location's business name (case-insensitive,\n  matched both directions). A location with no business name set has nothing branded.\n- `is_threshold` — Google returned only its privacy-threshold floor, so `current` is\n  a lower-bound estimate rather than an exact count. Surface it as \"estimated\".\n\nOnly terms with impressions in the **current** range are returned, so a keyword that\ndisappeared this period is omitted rather than returned as `0`."
      parameters:
        -
          in: query
          name: start_month
          description: 'First month of the range, `MM-YYYY`.'
          example: 05-2026
          required: true
          schema:
            type: string
            description: 'First month of the range, `MM-YYYY`.'
            example: 05-2026
        -
          in: query
          name: end_month
          description: 'Last month of the range, `MM-YYYY`. Must be on or after `start_month` and within 24 months of it.'
          example: 07-2026
          required: true
          schema:
            type: string
            description: 'Last month of the range, `MM-YYYY`. Must be on or after `start_month` and within 24 months of it.'
            example: 07-2026
        -
          in: query
          name: search
          description: 'Case-insensitive substring match on the keyword. Max 255 characters.'
          example: 'near me'
          required: false
          schema:
            type: string
            description: 'Case-insensitive substring match on the keyword. Max 255 characters.'
            example: 'near me'
        -
          in: query
          name: 'filter[branded]'
          description: 'Restrict to branded (`1`) or non-branded (`0`) terms; omit for both. **Send `1` or `0`** — the strings `true` / `false` are rejected with 422.'
          example: false
          required: false
          schema:
            type: boolean
            description: 'Restrict to branded (`1`) or non-branded (`0`) terms; omit for both. **Send `1` or `0`** — the strings `true` / `false` are rejected with 422.'
            example: false
        -
          in: query
          name: min_impressions
          description: 'Drop rows below this many impressions in the current range. Defaults to `0`.'
          example: 25
          required: false
          schema:
            type: integer
            description: 'Drop rows below this many impressions in the current range. Defaults to `0`.'
            example: 25
        -
          in: query
          name: sort
          description: 'Sort order. One of `searches`, `-searches`, `trend`, `-trend` (`-` prefix is descending). Defaults to `-searches`. Sorting by keyword is not supported, and rows with no trend always sort last.'
          example: '-searches'
          required: false
          schema:
            type: string
            description: 'Sort order. One of `searches`, `-searches`, `trend`, `-trend` (`-` prefix is descending). Defaults to `-searches`. Sorting by keyword is not supported, and rows with no trend always sort last.'
            example: '-searches'
        -
          in: query
          name: per_page
          description: 'Rows per page, 1–100. Defaults to `25`.'
          example: 25
          required: false
          schema:
            type: integer
            description: 'Rows per page, 1–100. Defaults to `25`.'
            example: 25
        -
