  '/public/api/v1/locations/{id}/performance/queries/detail':
    get:
      summary: "Query detail — one keyword's 6-month history"
      operationId: queryDetailOneKeywords6MonthHistory
      description: "The impression history for a single search term, for drilling into a row returned by\n`queries/table`.\n\n**Returns**\n- `keyword` — echoed back.\n- `searches` — impressions for the requested month range.\n- `is_threshold` — as on the table, but **scoped to the current range only**. The\n  table aggregates the flag across the current *and* prior windows, so the same\n  keyword can be flagged estimated in the table yet not here.\n- `chart.data[]` — `{period (YYYY-MM), value}`, the same fixed six-month\n  `end_month - 5 … end_month` window as the overview sparkline, so `start_month`\n  does not affect it.\n\n`keyword` is matched **exactly** — it is a query parameter, not a path segment, and\nnot a substring search. Pass the value exactly as `queries/table` returned it; an\nunknown keyword yields zero/`null` values rather than a 404."
      parameters:
        -
          in: query
          name: start_month
          description: 'First month of the range, `MM-YYYY`.'
          example: 05-2026
          required: true
          schema:
            type: string
            description: 'First month of the range, `MM-YYYY`.'
            example: 05-2026
        -
          in: query
          name: end_month
          description: 'Last month of the range, `MM-YYYY`. Must be on or after `start_month` and within 24 months of it.'
          example: 07-2026
          required: true
          schema:
            type: string
            description: 'Last month of the range, `MM-YYYY`. Must be on or after `start_month` and within 24 months of it.'
            example: 07-2026
        -
          in: query
          name: keyword
          description: 'The exact search term, as returned by `queries/table`. Max 255 characters.'
          example: 'example pressure washing'
          required: true
          schema:
            type: string
            description: 'The exact search term, as returned by `queries/table`. Max 255 characters.'
            example: 'example pressure washing'
      responses:
        200:
          description: Success
          content:
            application/json:
              schema:
                type: object
                example:
                  keyword: 'example pressure washing'
                  searches: 215
                  is_threshold: false
                  chart:
                    data:
                      -
                        period: 2026-02
                        value: 65
                      -
                        period: 2026-03
                        value: 53
                properties:
                  keyword:
                    type: string
                    example: 'example pressure washing'
                  searches:
                    type: integer
                    example: 215
                  is_threshold:
                    type: boolean
                    example: false
                  chart:
                    type: object
                    properties:
                      data:
                        type: array
                        example:
                          -
                            period: 2026-02
                            value: 65
                          -
                            period: 2026-03
                            value: 53
                        items:
                          type: object
                          properties:
                            period:
                              type: string
                              example: 2026-02
                            value:
                              type: integer
                              example: 65
        401:
          description: Unauthorized
          content:
            application/json:
              schema:
                type: object
                example:
                  error: Unauthenticated
                properties:
                  error:
                    type: string
                    example: Unauthenticated
        404:
          description: 'Location not in your account'
          content:
            application/json:
              schema:
                type: object
                example:
                  error:
                    code: 404
                    title: 'oops! something went wrong'
                    description: 'Location not found.'
                properties:
                  error:
                    type: object
                    properties:
                      code:
                        type: integer
                        example: 404
                      title:
                        type: string
                        example: 'oops! something went wrong'
                      description:
                        type: string
                        example: 'Location not found.'
      tags:
        - 'GBP Insights'
    parameters:
      -
        in: path
        name: id
        description: 'Location id, from `GET locations`.'
        example: 101
        required: true
        schema:
          type: integer
  /public/api/v1/google/entities:
    get:
      summary: 'List connected Google locations and properties'
      operationId: listConnectedGoogleLocationsAndProperties
      description: "**Returns**\n- `data[].entity_type` — `gbp` for a Business Profile location, `gsc` for a\n  Search Console property.\n- `data[].display_name` / `domain` — the human name and its bare host.\n- `data[].property_key` — Search Console's own identifier, either\n  `sc-domain:example.com` (domain property) or a URL prefix like\n  `https://example.com/`. `null` for locations.\n- `data[].location_ref` — the Google Business Profile location id. `null` for\n  properties.\n- `data[].lead_source` — the company it is linked to, `null` when unmapped.\n  Its `id` is what the Search Console endpoints take as `company_id`.\n- `data[].suggested_lead_source` — a company whose website domain matches,\n  offered only for unmapped rows. `null` otherwise.\n- `data[].status` — `mapped`, `unmapped`, `skipped` or `archived`. Only\n  `mapped` rows sync data.\n- `data[].is_unverified` — Search Console properties only. `true` means Google\n  does not consider you a verified owner and refuses every metrics query, so\n  the row will never populate however long you wait.\n- `data[].latest_data_date` — newest day this property has data for. Always\n  `null` for locations.\n- `meta.counts` — totals per status across the whole account, unaffected by the\n  `type` / `status` / `filter[display_name]` filters.\n\nConnected Google account email addresses, their reauthentication state and the\naccount's rollout flag are returned in-app but omitted here — they drive\ncontrols the public API does not expose. Each row keeps a numeric\n`google_account.id` so rows sharing a connected account can still be grouped."
      parameters:
        -
          in: query
          name: type
          description: 'Restrict to one kind of entity: `gbp` or `gsc`. Defaults to `all`.'
          example: gsc
          required: false
          schema:
            type: string
            description: 'Restrict to one kind of entity: `gbp` or `gsc`. Defaults to `all`.'
            example: gsc
        -
          in: query
          name: status
          description: 'Restrict to one status: `mapped`, `unmapped`, `skipped` or `archived`. Defaults to `all`.'
