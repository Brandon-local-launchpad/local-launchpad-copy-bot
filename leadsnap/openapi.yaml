      operationId: getACallTranscript
      description: "Returns the transcript, speaker segments and AI call score for one phone\ncall. Only calls transcribed by LeadSnap have a transcript.\n\n**Returns**\n- `status` - `pending`, `processing`, `completed`, `failed` or `skipped`.\n- `skip_reason` - why a skipped call was not transcribed: `monthly_cap`, `too_long`, `missing_media` or `empty_audio`; null otherwise.\n- `transcript` - plain text; null until `status` is `completed`.\n- `segments` - speaker turns as `{speaker, channel, start, end, text}`; `speaker` is a zero-based label.\n- `score` - `{status, skip_reason, qualification, confidence, summary, reason, scored_at}` or null when scoring has not started. `qualification` is `qualified` or `not_qualified`."
