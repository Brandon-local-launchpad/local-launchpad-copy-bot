                    - place_id
                    - keywords
                    - grid_size
                search_types:
                  type: array
                  description: ''
                  example:
                    - local_pack
                  items:
                    type: string
                    enum:
                      - google_maps
                      - local_pack
                schedule_config:
                  type: object
                  description: 'Recurrence settings for the schedule.'
                  example:
                    repeat_type: custom-month
                    repeat_every: 5
                    schedule_hour_minute: '05:00'
                    timezone: '+02:00'
                  properties:
                    repeat_type:
                      type: string
                      description: "Recurrence pattern. Each value has different requirements for `repeat_every` and `repeat_on`:<br><br>\n- `week` — runs once a week on a fixed day. **Requires** `repeat_on` (1=Monday … 7=Sunday). `repeat_every` is ignored.<br>\n  _Example: run every Monday → `repeat_type: \"week\", repeat_on: 1`_<br><br>\n- `month` — runs once a month on a fixed calendar day. **Requires** `repeat_on` (1–31). `repeat_every` is ignored.<br>\n  _Example: run on the 15th of every month → `repeat_type: \"month\", repeat_on: 15`_<br><br>\n- `custom-day` — runs every N days. **Requires** `repeat_every` (≥ 1). `repeat_on` is ignored.<br>\n  _Example: run every 3 days → `repeat_type: \"custom-day\", repeat_every: 3`_<br><br>\n- `custom-week` — runs every N weeks. **Requires** `repeat_every` (≥ 1). `repeat_on` is ignored.<br>\n  _Example: run every 2 weeks → `repeat_type: \"custom-week\", repeat_every: 2`_<br><br>\n- `custom-month` — runs every N months. **Requires** `repeat_every` (≥ 1). `repeat_on` is ignored.<br>\n  _Example: run every 6 months → `repeat_type: \"custom-month\", repeat_every: 6`_"
                      example: custom-month
                    repeat_every:
                      type: integer
                      description: 'optional Required when `repeat_type` is `custom-day`, `custom-week`, or `custom-month`. Specifies the interval between runs (minimum 1). Ignored for `week` and `month`.'
                      example: 5
                    repeat_on:
                      type: integer
                      description: 'optional Required when `repeat_type` is `week` or `month`. For `week`: day of the week where 1=Monday and 7=Sunday. For `month`: day of the calendar month (1–31). Ignored for `custom-*` types.'
                      example: 1
                    skip_weekends:
                      type: boolean
                      description: 'optional When `true`, a run that lands on a Saturday or Sunday is moved forward to the next working day. Applies to every `repeat_type`. Defaults to `false`.'
                      example: true
                    holiday_calendar:
                      type: string
                      description: 'optional Holiday calendar to skip. When set, a run that lands on an observed public holiday in that calendar is moved forward to the next working day. `null` (the default) skips no holidays. Currently only `US` (US federal holidays, 5 U.S.C. 6103, using the observed date) is supported.'
                      example: "US\n\n`skip_weekends` and `holiday_calendar` are independent, so all four combinations are valid — weekends only, holidays only, both, or neither.<br><br>\nThe recurrence itself is unaffected: `scheduled_at` remains the anchor the pattern is calculated from, and `next_run_at` is when the scan actually runs. This keeps interval types (`custom-*`) on their original cadence instead of drifting forward on every shift."
                    schedule_hour_minute:
                      type: string
                      description: 'optional Time of day to run the schedule in `HH:MM` 24-hour format. Defaults to `12:00`.'
                      example: '05:00'
                    timezone:
                      type: string
                      description: 'optional Timezone for the schedule. Accepts an IANA timezone name (e.g. `America/Chicago`) or a UTC offset (e.g. `+02:00`). Defaults to `UTC`.'
                      example: '+02:00'
                  required:
                    - repeat_type
              required:
                - heatmap_config
                - schedule_config
