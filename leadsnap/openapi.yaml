  '/public/api/v1/locations/{id}/performance/overview':
    get:
      summary: 'Overview — appearances, actions & recommendations'
      operationId: overviewAppearancesActionsRecommendations
      description: "Headline visibility for a date range: how often the profile appeared in Google,\nhow many actions it drove, the Maps-vs-Search impressions trend, and generated\nrecommendations.\n\n**Returns**\n- `cards.appearances`, `cards.actions`, `cards.calls` — each `{current, prior, change_pct}`.\n  `prior` is the equal-length range immediately before the requested one.\n  `change_pct` is `null` when `prior` is `0` (no baseline to compare against).\n- `chart.trend` — natural-language heading describing the series.\n- `chart.data[]` — one entry per calendar month: `period` (`YYYY-MM`), `maps`, `search`.\n- `recommendations[]` — `key`, `severity` (`info` | `success` | `warning`), `title`, `body`.\n  The list is generated from the numbers, so it varies per location and may be empty.\n- `summary` — one-line plain-language recap of the range."
      parameters:
        -
          in: query
          name: start_date
          description: 'Range start, `MM-DD-YYYY`.'
          example: 06-01-2026
          required: true
          schema:
            type: string
            description: 'Range start, `MM-DD-YYYY`.'
            example: 06-01-2026
        -
          in: query
          name: end_date
          description: 'Range end, `MM-DD-YYYY`. Must be on or after `start_date` and within 24 months of it.'
          example: 06-30-2026
          required: true
          schema:
            type: string
            description: 'Range end, `MM-DD-YYYY`. Must be on or after `start_date` and within 24 months of it.'
