  '/public/api/v1/locations/{id}/performance/engagement':
    get:
      summary: 'Engagement — customer actions & conversion funnel'
      operationId: engagementCustomerActionsConversionFunnel
      description: "What people did after finding the profile, broken down by action type, plus the\nappearance-to-action funnel and the branded/discovery search split.\n\n**Returns**\n- `cards.{calls, directions, website_clicks, conversations, bookings}` — each\n  `{current, prior, change_pct, sparkline[]}`. The `sparkline[]` is **daily**\n  (`period` is `YYYY-MM-DD`), one entry per day of the requested range.\n- `funnel.appearances`, `funnel.total_actions`, `funnel.ctr` — `ctr` is actions as\n  a percentage of appearances.\n- `funnel.breakdown` — keyed **object** (not a list) of the same five action types,\n  each `{value, share}` where `share` is a percentage of `total_actions`.\n- `chart.data[]` — monthly totals per action type: `period` (`YYYY-MM`) plus one key\n  per action.\n- `search_type` — `{trend, period_label, branded, discovery}`, where `branded` and\n  `discovery` are each `{current, prior, share, change_pct}`. Derived by matching\n  keywords against the location's business name, so a location with no name set has\n  nothing branded. Only these two buckets exist — there is no \"direct\" split.\n\nAction types Google never reports for a location come back as `0`, not absent —\n`bookings` is commonly `0` for service businesses."
      parameters:
        -
          in: query
          name: start_date
          description: 'Range start, `MM-DD-YYYY`.'
          example: 06-01-2026
          required: true
          schema:
            type: string
            description: 'Range start, `MM-DD-YYYY`.'
            example: 06-01-2026
        -
          in: query
          name: end_date
          description: 'Range end, `MM-DD-YYYY`. Must be on or after `start_date` and within 24 months of it.'
          example: 06-30-2026
          required: true
          schema:
            type: string
            description: 'Range end, `MM-DD-YYYY`. Must be on or after `start_date` and within 24 months of it.'
            example: 06-30-2026
      responses:
        200:
          description: Success
          content:
            application/json:
              schema:
                type: object
                example:
