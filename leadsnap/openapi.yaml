  /public/api/v1/gsc/performance:
    get:
      summary: 'Account rollup across every company'
      operationId: accountRollupAcrossEveryCompany
      description: "Totals across all of your mapped Search Console properties, plus a per-company\nbreakdown with a daily click trend for each. Use it for an account-wide view,\nand to discover the `lead_source_id` values the website-performance endpoint needs.\n\n**Optional company scope.** Send an `X-Company-ID` header to narrow the rollup —\n`totals` and `companies[]` then cover only that company. Without the header the\nrollup spans every company you can see.\n\n**Returns**\n- `meta.latest_data_date` — newest day any of your properties has data for.\n- `meta.companies_with_gsc` — companies holding a mapped, active property.\n- `meta.companies_with_data` — of those, how many reported data in this window.\n- `meta.truncated` — `true` when more than 500 companies matched; `totals` still\n  covers every property, only `companies[]` is capped.\n- `totals` / `companies[].*` — `clicks`, `impressions`, `ctr` (percent, e.g.\n  `0.7` means 0.7%), `position` (impression-weighted average, `null` when the\n  window has no ranked impressions), each with a matching `prior`.\n- `companies[].lead_source_id` — the company id. Pass it to\n  `gsc/website-performance`.\n- `companies[].type` — the company's classification, `seo` or `lead_gen`.\n- `companies[].trend[]` — one entry per day in the window, zero-filled.\n\nA company whose property has no data in the window is still listed, with zeroes."
