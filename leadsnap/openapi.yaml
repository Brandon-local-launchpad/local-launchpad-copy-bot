  /public/api/v1/phone-calls:
    get:
      summary: 'List phone calls'
      operationId: listPhoneCalls
      description: "Returns a paginated list of phone calls for the authenticated account.\n\n**Pagination** — root-level `total`, `last_page`, `per_page`, `current_page`.\n`meta.summary` carries counts for the filtered set: `total`, `qualified`,\n`not_qualified`, `voicemail`.\n\n**Recording links** — on the public API, `recording_url` is a short-lived\n(60 minute) presigned link, so download the recording soon after listing.\n\n**Call intelligence** - `transcript_status` (`pending`, `processing`, `completed`,\n`failed`, `skipped` or null), `has_transcript`, `transcript_skip_reason`,\n`call_score` (`{qualification, confidence, summary}` once scored, else null),\n`call_score_status` and `can_transcribe`. The transcript body is served by the\ntranscript endpoint. `meta.call_intelligence_enabled` says whether the account\nhas the feature."
      parameters:
        -
          in: query
          name: search
          description: 'Search caller name / number, company name, or linked contact.'
          example: '555'
          required: false
          schema:
            type: string
            description: 'Search caller name / number, company name, or linked contact.'
            example: '555'
        -
          in: query
          name: company_id
          description: 'Filter by company (lead source) id.'
          example: 3
          required: false
          schema:
            type: integer
            description: 'Filter by company (lead source) id.'
            example: 3
        -
          in: query
          name: client
          description: 'Filter by client (lead group) ids.'
          example:
            - 5
          required: false
          schema:
            type: array
            description: 'Filter by client (lead group) ids.'
            example:
              - 5
            items:
              type: integer
        -
          in: query
          name: direction
          description: 'Filter by direction: inbound or outbound. Supports `is_any_of|inbound,outbound`.'
          example: inbound
          required: false
          schema:
            type: string
            description: 'Filter by direction: inbound or outbound. Supports `is_any_of|inbound,outbound`.'
            example: inbound
        -
          in: query
          name: voicemail
          description: 'Filter to voicemails (true) or non-voicemails (false).'
          example: false
          required: false
          schema:
            type: boolean
            description: 'Filter to voicemails (true) or non-voicemails (false).'
            example: false
        -
          in: query
          name: qualified
          description: 'Filter to qualified calls (those that generated a lead) when true.'
          example: true
          required: false
          schema:
            type: boolean
            description: 'Filter to qualified calls (those that generated a lead) when true.'
            example: true
        -
          in: query
          name: created_at_from
          description: 'date Call-date range start (YYYY-MM-DD).'
          example: '2026-01-01'
          required: false
          schema:
            type: string
            description: 'date Call-date range start (YYYY-MM-DD).'
            example: '2026-01-01'
        -
          in: query
          name: created_at_to
          description: 'date Call-date range end (YYYY-MM-DD, inclusive).'
          example: '2026-06-30'
          required: false
          schema:
            type: string
            description: 'date Call-date range end (YYYY-MM-DD, inclusive).'
            example: '2026-06-30'
        -
          in: query
          name: sort
          description: 'Sort field; prefix with `-` for descending. Accepted: contact, phone, direction, duration, company, occurred_at.'
          example: '-occurred_at'
          required: false
          schema:
            type: string
            description: 'Sort field; prefix with `-` for descending. Accepted: contact, phone, direction, duration, company, occurred_at.'
            example: '-occurred_at'
        -
          in: query
          name: per_page
          description: 'Results per page (default 25, max 100).'
          example: 25
          required: false
          schema:
            type: integer
            description: 'Results per page (default 25, max 100).'
            example: 25
        -
          in: query
          name: page
          description: 'Page number.'
          example: 1
          required: false
          schema:
            type: integer
            description: 'Page number.'
            example: 1
