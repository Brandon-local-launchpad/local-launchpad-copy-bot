  /public/api/v1/companies:
    get:
      summary: 'List companies'
      operationId: listCompanies
      description: "**Returns** a flat Laravel paginator: `data[]` alongside `current_page`,\n`per_page`, `total`, `last_page`, `from`, `to`, `links[]` and the\n`*_page_url` fields at the top level. There is **no `meta` wrapper**.\n\nEach `data[]` row carries `id`, `name`, `website`, `client_type`\n(`seo` or `lead_gen`), `phone`, `address`, `timezone`, `country`, `activated`\nand the timestamps. `deleted_at` is non-null for archived companies, which are\nexcluded unless you ask for them with `filter[trashed]`.\n\nWith `include=gsc_property`, a mapped company also carries `gsc_property` with\nits `property_key`, `status`, `last_synced_at` and `latest_data_date` — the\nfastest way to see which companies have Search Console data available.\nCompanies with no mapping omit the key."
      parameters:
        -
          in: query
          name: include
          description: 'Comma-separated relations to embed: `gsc_property`, `website_form`, `tags`.'
          example: gsc_property
          required: false
          schema:
            type: string
            description: 'Comma-separated relations to embed: `gsc_property`, `website_form`, `tags`.'
            example: gsc_property
        -
          in: query
          name: search
          description: 'Case-insensitive substring match on the company name.'
          example: example
          required: false
          schema:
            type: string
            description: 'Case-insensitive substring match on the company name.'
            example: example
        -
          in: query
          name: 'filter[name]'
          description: 'Filter by name.'
          example: 'Example Physicals'
          required: false
          schema:
            type: string
            description: 'Filter by name.'
            example: 'Example Physicals'
        -
          in: query
          name: 'filter[website]'
          description: 'Filter by website.'
          example: example.com
          required: false
          schema:
            type: string
            description: 'Filter by website.'
            example: example.com
        -
          in: query
          name: 'filter[activated]'
          description: 'Restrict to activated (`1`) or not (`0`).'
          example: true
          required: false
          schema:
            type: boolean
            description: 'Restrict to activated (`1`) or not (`0`).'
            example: true
        -
          in: query
          name: 'filter[trashed]'
          description: 'Include archived companies: `with` for both, `only` for archived alone. Omit for active only.'
          example: with
          required: false
          schema:
            type: string
            description: 'Include archived companies: `with` for both, `only` for archived alone. Omit for active only.'
            example: with
        -
          in: query
          name: sort
          description: 'Sort order. One of `id`, `name`, `website`, `activated`, `created_at`, `updated_at`, `deleted_at`; prefix with `-` for descending.'
          example: name
          required: false
          schema:
            type: string
            description: 'Sort order. One of `id`, `name`, `website`, `activated`, `created_at`, `updated_at`, `deleted_at`; prefix with `-` for descending.'
            example: name
        -
          in: query
          name: per_page
          description: 'Rows per page, capped at 100 on the public API.'
          example: 25
          required: false
          schema:
            type: integer
            description: 'Rows per page, capped at 100 on the public API.'
            example: 25
        -
          in: query
          name: page
          description: 'Page number, from 1.'
          example: 1
          required: false
          schema:
            type: integer
            description: 'Page number, from 1.'
            example: 1
      responses:
        200:
          description: Success
          content:
            application/json:
              schema:
                type: object
