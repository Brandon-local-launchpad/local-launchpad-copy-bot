  '/public/api/v1/locations/{id}/performance/queries/overview':
    get:
      summary: 'Queries overview — total searches & 6-month trend'
      operationId: queriesOverviewTotalSearches6MonthTrend
      description: "Total number of searches that surfaced this location in Google Maps over a month\nrange, with a six-month trend line. This is the headline figure for the keyword\ndata returned by the two endpoints below.\n\n**Returns**\n- `searches.current` — total searches in the requested month range.\n- `searches.prior` — the equal-length month block immediately before it\n  (`05-2026..07-2026` → `02-2026..04-2026`).\n- `searches.change_pct` — `null` when `prior` is `0`.\n- `searches.sparkline[]` — `{period (YYYY-MM), value}`.\n\n**`sparkline` ignores `start_month`.** It is always the six months\n`end_month - 5 … end_month`, regardless of the range you request — so\n`05-2026..07-2026` still returns `2026-02 … 2026-07`. Use `current` / `prior` for\nthe range you asked for, and `sparkline` only for the fixed six-month trend."
      parameters:
        -
          in: query
          name: start_month
          description: 'First month of the range, `MM-YYYY`.'
          example: 05-2026
          required: true
          schema:
            type: string
            description: 'First month of the range, `MM-YYYY`.'
            example: 05-2026
        -
          in: query
          name: end_month
          description: 'Last month of the range, `MM-YYYY`. Must be on or after `start_month` and within 24 months of it.'
          example: 07-2026
          required: true
          schema:
            type: string
            description: 'Last month of the range, `MM-YYYY`. Must be on or after `start_month` and within 24 months of it.'
            example: 07-2026
      responses:
        200:
          description: Success
          content:
            application/json:
              schema:
                type: object
                example:
                  searches:
                    current: 4497
                    prior: 4223
                    change_pct: 6.5
                    sparkline:
                      -
                        period: 2026-02
                        value: 1378
                      -
                        period: 2026-03
                        value: 1381
                properties:
                  searches:
                    type: object
                    properties:
                      current:
                        type: integer
                        example: 4497
                      prior:
                        type: integer
                        example: 4223
                      change_pct:
                        type: number
                        example: 6.5
                      sparkline:
                        type: array
                        example:
                          -
                            period: 2026-02
                            value: 1378
                          -
                            period: 2026-03
                            value: 1381
                        items:
                          type: object
                          properties:
                            period:
                              type: string
                              example: 2026-02
                            value:
                              type: integer
                              example: 1378
        401:
          description: Unauthorized
          content:
            application/json:
              schema:
                type: object
                example:
                  error: Unauthenticated
                properties:
                  error:
                    type: string
                    example: Unauthenticated
        404:
          description: 'Location not in your account'
          content:
            application/json:
              schema:
                type: object
                example:
                  error:
                    code: 404
                    title: 'oops! something went wrong'
                    description: 'Location not found.'
                properties:
                  error:
                    type: object
                    properties:
                      code:
                        type: integer
                        example: 404
                      title:
                        type: string
                        example: 'oops! something went wrong'
                      description:
                        type: string
                        example: 'Location not found.'
      tags:
