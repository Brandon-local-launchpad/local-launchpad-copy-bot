  /public/api/v1/gsc/website-performance:
    get:
      summary: "One company's website performance"
      operationId: oneCompanysWebsitePerformance
      description: "Every Search Console metric for a single company's website, in one request.\nAsk only for the blocks you need — `blocks` is a comma-separated list and the\nresponse is keyed by block name, so requesting three blocks returns three keys.\n\n**Choosing the company.** Send the `X-Company-ID` header or `?company_id=`;\nif both are present the header wins. Get ids from `gsc/performance`\n(`companies[].lead_source_id`) or `GET companies`.\n\n**Available blocks**\n- `overview` — headline cards vs the prior window, plain-language summary\n  sentences, and a per-day trend.\n- `queries` — top 25 search terms by clicks, each tagged `branded` / `local` / `maps`.\n- `pages` — top 10 landing pages. Requires `lens`.\n- `devices` — click split across mobile, desktop and tablet.\n- `new-queries` — terms with 3+ clicks now and none in the prior window.\n- `ctr-gaps` — terms with 100+ impressions clicking below the expected rate for\n  their position.\n- `surfaces` — impression split across web, image, video, news and discover.\n- `movers` — the five biggest position gains and five biggest drops.\n- `position-distribution` — how many terms sit in positions 1-3, 4-10, 11-20, 21+.\n- `opportunities` — terms ranking 4-15 with 100+ impressions.\n- `valuable-keywords` — always empty in v1 (see `has_cpc` below).\n- `attention` — terms or pages that got materially worse. Requires `lens`.\n\n**`lens` is required only for `pages` and `attention`**, and must be one of\n`clicks`, `impressions`, `position`, `search_value`. Requesting either block\nwithout a valid lens returns 422. If you ask for neither, `lens` is ignored.\n\n**`has_cpc` is `false` in this version**, so anything money-derived is inert:\n`valuable-keywords.rows` is always `[]`, `opportunities[].est_value_gain` is\nalways `null`, `trend.days[].search_value` is always `null`, and `attention`\nunder the `search_value` lens always returns no rows.\n\n**Dates are optional here** — unlike `gsc/performance`, where both are required.\nOmitted, the window ends at the property's `latest_data_date` (or two days ago)\nand starts 89 days earlier.\n\n**Errors are not all shaped alike.** `blocks` and `lens` failures return a bare\n`{\"message\": \"...\"}`; date failures return the standard Laravel\n`{\"message\": ..., \"errors\": {...}}` bag."
      parameters:
        -
          in: query
          name: blocks
          description: 'Comma-separated block names from the list above.'
          example: 'overview,queries,devices'
          required: true
          schema:
            type: string
            description: 'Comma-separated block names from the list above.'
            example: 'overview,queries,devices'
        -
          in: query
          name: lens
          description: 'Required when `blocks` includes `pages` or `attention`. One of `clicks`, `impressions`, `position`, `search_value`.'
          example: clicks
          required: false
          schema:
            type: string
            description: 'Required when `blocks` includes `pages` or `attention`. One of `clicks`, `impressions`, `position`, `search_value`.'
            example: clicks
        -
          in: query
          name: company_id
          description: 'The company to report on, if you are not sending the `X-Company-ID` header. From `gsc/performance` (`companies[].lead_source_id`).'
          example: 6860
          required: false
          schema:
            type: integer
            description: 'The company to report on, if you are not sending the `X-Company-ID` header. From `gsc/performance` (`companies[].lead_source_id`).'
            example: 6860
        -
          in: query
          name: start_date
          description: 'First day of the window, `YYYY-MM-DD`, UTC. Defaults to 89 days before `end_date`.'
          example: '2026-07-29'
          required: false
          schema:
            type: string
            description: 'First day of the window, `YYYY-MM-DD`, UTC. Defaults to 89 days before `end_date`.'
            example: '2026-07-29'
        -
          in: query
          name: end_date
          description: "Last day of the window, `YYYY-MM-DD`, UTC. Must be on or after `start_date` and within 16 months of it. Defaults to the property's `latest_data_date`."
          example: '2026-08-25'
          required: false
          schema:
            type: string
            description: "Last day of the window, `YYYY-MM-DD`, UTC. Must be on or after `start_date` and within 16 months of it. Defaults to the property's `latest_data_date`."
