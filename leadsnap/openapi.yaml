  /public/api/v1/contacts:
    get:
      summary: 'List contacts'
      operationId: listContacts
      description: "Returns a paginated list of contacts for the authenticated account. Supports\nsearch, filtering, sorting and pagination.\n\n**Pagination** — fields are returned at the root level alongside `data`:\n`total`, `last_page`, `per_page`, `current_page`. A `meta.summary` object carries\ncounts for the filtered set: `total`, `spam`, `by_source`, `by_last_activity`."
      parameters:
        -
          in: query
          name: search
          description: 'Search across first name, last name, email, phone.'
          example: john
          required: false
          schema:
            type: string
            description: 'Search across first name, last name, email, phone.'
            example: john
        -
          in: query
          name: company_id
          description: 'Filter by company (lead source) id.'
          example: 3
          required: false
          schema:
            type: integer
            description: 'Filter by company (lead source) id.'
            example: 3
        -
          in: query
          name: client
          description: 'Filter by client (lead group) ids — contacts whose company belongs to one of these groups.'
          example:
            - 5
          required: false
          schema:
            type: array
            description: 'Filter by client (lead group) ids — contacts whose company belongs to one of these groups.'
            example:
              - 5
            items:
              type: integer
        -
          in: query
          name: source
          description: 'Filter by first-touch source. Values: form_submission, phone, sms, import, manual, campaign, pipeline. Supports `is_any_of|phone,form_submission` and `is_none_of|...`.'
          example: form_submission
          required: false
          schema:
            type: string
            description: 'Filter by first-touch source. Values: form_submission, phone, sms, import, manual, campaign, pipeline. Supports `is_any_of|phone,form_submission` and `is_none_of|...`.'
            example: form_submission
        -
          in: query
          name: last_activity_type
          description: 'Filter by the most-recent activity channel. Values: call, sms, email, voicemail, form_submission (the UI labels `call` as "Phone"). Supports `is_any_of|call,sms`.'
          example: call
          required: false
          schema:
            type: string
            description: 'Filter by the most-recent activity channel. Values: call, sms, email, voicemail, form_submission (the UI labels `call` as "Phone"). Supports `is_any_of|call,sms`.'
            example: call
        -
          in: query
          name: status
          description: 'Filter by status. Accepted: active, disabled.'
          example: active
          required: false
          schema:
            type: string
            description: 'Filter by status. Accepted: active, disabled.'
            example: active
        -
          in: query
          name: is_spam
          description: 'Show spam contacts only when true; default hides spam.'
          example: false
