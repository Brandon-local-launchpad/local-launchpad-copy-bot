                      type: string
                      description: 'Schedule name.'
                      example: 'Weekly Roofing Check'
                    place_id:
                      type: integer
                      description: 'The heatmap place ID.'
                      example: 2795512
                    keywords:
                      type: array
                      description: 'Keywords to search.'
                      example:
                        - Plumbing
                        - 'general contractor'
                        - electrician
                        - hvac
                      items:
                        type: string
                    grid_size:
                      type: integer
                      description: 'Grid dimension per side. Must be one of `3`, `5`, `7`, `9`, `13` — a `13` grid is 13x13, or 169 points. Pass the same value used to compute `grid_points`.'
                      example: 13
                    location_id:
                      type: integer
                      description: 'optional Location ID to associate the schedule with.'
                      example: 20
                    lead_source_id:
                      type: integer
                      description: 'optional Lead source / company ID.'
                      example: 3
                    lat:
                      type: number
                      description: 'optional Grid center latitude. Defaults to the average of `grid_points` when omitted, null, or `0`.'
                      example: 28.301844298972
                    lng:
                      type: number
                      description: 'optional Grid center longitude. Defaults to the average of `grid_points` when omitted, null, or `0`.'
                      example: -81.485368416424
                  required:
