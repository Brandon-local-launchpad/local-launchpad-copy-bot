openapi: 3.0.3
info:
  title: 'API Documentation (Beta)'
  description: 'API reference for the platform. We are currently starting with support for the Heatmaps API.'
  version: 1.0.0
servers:
  -
    url: 'http://localhost'
tags:
  -
    name: Citations
    description: ''
  -
    name: Companies
    description: "\nThe companies (also called clients or lead sources) on your account.\n\nA company id is the scope key for most company-aware endpoints, including the\nSearch Console reads, which take it as the `X-Company-ID` header or a\n`company_id` query parameter. Pass `?include=gsc_property` to get each\ncompany's mapped Search Console property in the same call.\n\nA restricted token sees only the companies assigned to it. A company outside\nyour account returns `404`, never `403`, so ids cannot be probed.\n\nCreating, updating and archiving companies are in-app operations and are not\navailable on the public API, which is read-only."
  -
    name: Contacts
    description: "\nRead-only access to CRM contacts. A contact is created for every lead (phone\ncall, form submission, SMS, email), so this is the canonical people directory."
  -
    name: 'Form Submissions'
    description: "\nRead-only access to website form submissions."
  -
    name: 'GBP Insights'
    description: "\nRead-only Google Business Profile performance data for a single location:\nimpressions, customer actions, platform/device split, and search keywords.\n\nAll reads come from our own synced copy of the GBP Performance API — no live\nGoogle call happens on request, so responses are fast but only as current as the\nlast nightly sync.\n\n**Get a location id first** from `GET locations`. A location outside your account\nreturns `404` (never `403`), so ids cannot be probed.\n\n**Two date-parameter families, not interchangeable:**\n| Endpoints | Params | Format | Example |\n|---|---|---|---|\n| `performance/overview`, `engagement`, `platform-devices` | `start_date`, `end_date` | `MM-DD-YYYY` | `06-01-2026` |\n| `performance/queries/*` | `start_month`, `end_month` | `MM-YYYY` | `05-2026` |\n\nBoth are required on every request and capped at a **24-month span**.\n\n**`null` is not `0`.** In every chart and sparkline, `null` means that period was\nnever covered by a sync (render a gap) and `0` means it synced as a genuine zero.\nFlattening `null` to `0` invents data that Google never reported.\n\nSample responses below are abbreviated — repeating arrays are cut to two entries."
  -
    name: 'Google Entities'
    description: "\nThe Google assets connected to your account — Business Profile locations and\nSearch Console properties — in one list, each showing which company it is\nlinked to.\n\nUse it to see which Search Console properties exist and whether they are\nmapped. A property must be `mapped` before `gsc/website-performance` will\nreturn anything for its company.\n\nLinking, skipping and archiving are in-app operations and are not available on\nthe public API, which is read-only."
  -
    name: 'Heatmap Points'
    description: "\nRetrieve individual grid points within a heatmap, including their ranking data and organic search results."
  -
    name: 'Heatmap Schedules'
    description: "\nCreate and manage automated heatmap schedules. Schedules run heatmaps on a recurring interval (weekly, monthly, or custom)."
  -
    name: Heatmaps
    description: "\nCreate, retrieve, re-run and delete heatmaps.\n\nThe core object of a heatmap is a **Google Place** — any business or location that has a Google Place ID can be used as the target of a heatmap, regardless of whether it is managed by the account. The place is always returned in the `place` object.\n\nIf the targeted place is also a **location managed by the account** (i.e. connected via Google Business Profile), it is additionally exposed in the `location` object for clarity. This allows you to cross-reference heatmap results with your managed location data such as review stats, GMB insights, and citation subscriptions.\n\nTo get the `place_id` of a managed location, use the [List locations](#tag/Heatmaps/GET/public/api/v1/heatmaps/locations) endpoint."
  -
    name: Locations
    description: "\nRead-only access to Google Business Profile (GBP) locations and their details."
  -
    name: 'Phone Calls'
    description: "\nRead-only access to phone calls across LeadSnap Phone System, CallRail and\nCallSling (the unified `calls` table)."
  -
    name: 'Search Console'
    description: "\nRead-only Google Search Console data for the websites linked to your companies:\nclicks, impressions, average position and click-through rate, broken down by\nquery, page, device and search surface.\n\nAll reads come from our own synced copy of the Search Console API — no live\nGoogle call happens on request. The sync trails Google by about two days, so\nevery response carries a `latest_data_date`; treat that, not today, as the end\nof the usable window.\n\n**Start here.** `GET gsc/performance` returns one entry per company in\n`companies[]`, each with its `lead_source_id`. That id is what\n`gsc/website-performance` takes as `X-Company-ID` or `?company_id=`, so the\nrollup doubles as the company lookup. `GET companies?include=gsc_property`\ngives the same ids alongside the rest of the company record.\n\n**Dates are `YYYY-MM-DD`.** Note this differs from the GBP Insights group in\nthese same docs, which uses `MM-DD-YYYY` and `MM-YYYY`. Every window is\ninterpreted in **UTC**, matching the sync, and is capped at a **16-month span**\n— Search Console's own retention, so nothing fetchable is ever refused.\n\n**`null` is not `0`.** In trend arrays, `position: null` means the day had no\nranking data, not rank zero — render a gap. A `clicks` value of `0` is a real\nzero-click day.\n\n**Comparisons are automatic.** Every figure ships with a `prior` object holding\nthe equal-length window immediately before yours. There is no `compare`\nparameter; sending one has no effect.\n\nSample responses below are abbreviated — repeating arrays are cut to a few entries."
components:
  securitySchemes:
    default:
      type: http
      scheme: bearer
      description: 'Authenticate using a Sanctum bearer token. Use @unauthenticated on a route method to mark public endpoints.'
security:
  -
    default: []
x-tagGroups:
  -
    name: Heatmaps
    tags:
      - Heatmaps
      - 'Heatmap Points'
      - 'Heatmap Schedules'
  -
    name: CRM
    tags:
      - Contacts
      - 'Phone Calls'
      - 'Form Submissions'
      - Companies
  -
    name: GBP
    tags:
      - Locations
      - Citations
      - 'GBP Insights'
  -
    name: 'Search Console'
    tags:
      - 'Search Console'
      - 'Google Entities'
