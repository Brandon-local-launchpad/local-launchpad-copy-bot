<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Trade facts — Local Launchpad</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #0f1117; --surface: #1a1d27; --surface2: #22263a;
    --accent: #6c63ff; --accent2: #5a52e0; --success: #4ade80;
    --danger: #f87171; --warning: #fbbf24; --text: #e2e8f0; --muted: #94a3b8;
    --border: #2d3148; --r: 10px; --font: 'Inter', system-ui, sans-serif;
  }
  body { background: var(--bg); color: var(--text); font-family: var(--font); min-height: 100vh; padding: 2rem; font-size: 14px; }
  @media (max-width: 640px) { body { padding: 1rem; } }
  a { color: var(--accent); text-decoration: none; }
  .breadcrumb { color: var(--muted); font-size: 13px; margin-bottom: 1.5rem; }
  .breadcrumb a { color: var(--muted); }
  .header { display: flex; align-items: flex-start; justify-content: space-between; margin-bottom: 1.5rem; gap: 1rem; flex-wrap: wrap; }
  h1 { font-size: 1.5rem; font-weight: 700; }
  .sub { color: var(--muted); font-size: 13px; margin-top: 3px; max-width: 70ch; }
  .btn { display: inline-flex; align-items: center; gap: 6px; border: none; border-radius: var(--r); font-family: var(--font); font-size: 13px; font-weight: 600; padding: 7px 13px; cursor: pointer; text-decoration: none; }
  .btn-ghost { background: transparent; color: var(--muted); border: 1px solid var(--border); }
  .btn-ghost:hover { color: var(--text); }
  .btn-primary { background: var(--accent); color: #fff; }
  .btn-primary:hover { background: var(--accent2); }
  .btn:disabled { opacity: .5; cursor: default; }
  .who { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 13px; }
  .who input { background: var(--surface); color: var(--text); border: 1px solid var(--border); border-radius: var(--r); padding: 6px 10px; font-family: var(--font); font-size: 13px; width: 11rem; }
  .list { display: grid; gap: .6rem; }
  .row { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r); padding: 1rem 1.25rem; display: grid; grid-template-columns: 1.2fr 1fr 1.6fr 1.6fr auto; gap: 1rem; align-items: center; }
  .row.head { background: transparent; border: none; color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .04em; padding-top: 0; padding-bottom: 0; }
  @media (max-width: 900px) { .row { grid-template-columns: 1fr 1fr; } .row.head { display: none; } }
  .name { font-weight: 600; text-transform: capitalize; }
  .meta { color: var(--muted); font-size: 12px; margin-top: 2px; }
  .badge { display: inline-block; border-radius: 20px; padding: 3px 10px; font-size: 11px; font-weight: 700; white-space: nowrap; }
  .b-yes { background: rgba(74,222,128,.15); color: var(--success); }
  .b-no { background: rgba(248,113,113,.15); color: var(--danger); }
  .b-warn { background: rgba(251,191,36,.15); color: var(--warning); }
  .b-muted { background: var(--surface2); color: var(--muted); }
  .empty { color: var(--muted); text-align: center; padding: 3rem; }
  .notice { background: rgba(251,191,36,.1); border: 1px solid rgba(251,191,36,.4); color: var(--warning); border-radius: var(--r); padding: .75rem 1rem; margin-bottom: 1rem; font-size: 13px; }
  .err { color: var(--danger); font-size: 13px; margin-top: .5rem; }
  code { background: var(--surface2); padding: 1px 5px; border-radius: 4px; font-size: 12px; }
  .acts { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
</style>
</head>
<body>

<div class="breadcrumb"><a href="/clients.html">← Clients</a></div>
<div class="header">
  <div>
    <h1>Trade facts</h1>
    <div class="sub">One research pack per niche, written by <code>node scripts/trade-facts.js</code>. Read a pack, then press Verify: service pages for a niche are only written from a verified pack. A re-run of the script makes the pack unverified again.</div>
  </div>
  <div class="who">
    <label for="who">Verifying as</label>
    <input id="who" type="text" placeholder="Your name" autocomplete="name">
    <button class="btn btn-ghost" onclick="load()">Refresh</button>
  </div>
</div>

<div id="notice"></div>
<div class="list" id="list"><div class="empty">Loading…</div></div>
<div class="err" id="err"></div>

<script>
  const esc = s => String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  const fmt = s => s ? new Date(s).toLocaleString('en-GB', { day:'numeric', month:'short', year:'numeric', hour:'2-digit', minute:'2-digit' }) : '';
  const whoEl = document.getElementById('who');
  try { whoEl.value = localStorage.getItem('tradeFactsWho') || ''; } catch {}
  whoEl.addEventListener('input', () => { try { localStorage.setItem('tradeFactsWho', whoEl.value); } catch {} });

  function verifiedCell(p) {
    if (!p.exists) return '<span class="badge b-muted">no pack</span>';
    if (p.verified) return `<span class="badge b-yes">yes</span><div class="meta">${esc(p.verifiedBy)} · ${fmt(p.verifiedAt)}</div>`;
    if (p.stale) return `<span class="badge b-warn">no, re-generated</span><div class="meta">last verified by ${esc(p.lastVerifiedBy)} on ${fmt(p.lastVerifiedAt)} (pack of ${esc(p.lastVerifiedGenerated || '?')})</div>`;
    return '<span class="badge b-no">no</span>';
  }

  async function load() {
    document.getElementById('err').textContent = '';
    const res = await fetch('/api/trade-facts');
    if (!res.ok) { document.getElementById('list').innerHTML = `<div class="empty">Could not load: ${esc((await res.json().catch(() => ({}))).error || res.status)}</div>`; return; }
    const { packs, coreMissing } = await res.json();
    document.getElementById('notice').innerHTML = coreMissing ? '<div class="notice">The core prompt is missing: put it at <code>trade-facts/core.md</code> before running the script.</div>' : '';
    const list = document.getElementById('list');
    if (!packs.length) { list.innerHTML = '<div class="empty">No packs or blocks yet. Add a block at <code>trade-facts/blocks/&lt;niche&gt;.md</code> and run the script.</div>'; return; }
    list.innerHTML = `<div class="row head"><div>Niche</div><div>Generated</div><div>Model</div><div>Verified</div><div></div></div>` +
      packs.map(p => `<div class="row">
        <div><div class="name">${esc(p.niche)}</div><div class="meta">${p.exists ? esc(p.file) : (p.hasBlock ? 'block only, not generated yet' : 'no block')}${p.exists && !p.headerOk ? ' · header line missing or malformed' : ''}</div></div>
        <div>${p.exists ? esc(p.generated || '?') : '—'}</div>
        <div>${p.exists ? esc(p.model || '?') : '—'}</div>
        <div>${verifiedCell(p)}</div>
        <div class="acts">
          ${p.exists ? `<a class="btn btn-ghost" href="/api/trade-facts/${esc(p.niche)}" target="_blank" rel="noopener">Read</a>` : ''}
          ${p.exists && !p.verified ? `<button class="btn btn-primary" onclick="verify('${esc(p.niche)}')">Verify</button>` : ''}
          ${p.verified ? `<button class="btn btn-ghost" onclick="unverify('${esc(p.niche)}')">Unverify</button>` : ''}
        </div>
      </div>`).join('');
  }

  async function verify(niche) {
    const who = whoEl.value.trim();
    if (!who) { document.getElementById('err').textContent = 'Type your name in "Verifying as" first.'; whoEl.focus(); return; }
    if (!confirm(`Mark the ${niche} pack as verified by ${who}? Service pages for this niche will then be written from it.`)) return;
    const res = await fetch(`/api/trade-facts/${niche}/verify`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ who }) });
    const r = await res.json().catch(() => ({}));
    if (!res.ok || r.error) document.getElementById('err').textContent = 'Verify failed: ' + (r.error || res.status);
    load();
  }

  async function unverify(niche) {
    if (!confirm(`Clear the verified flag on the ${niche} pack? Service pages for this niche will be blocked until it is verified again.`)) return;
    const res = await fetch(`/api/trade-facts/${niche}/unverify`, { method: 'POST' });
    const r = await res.json().catch(() => ({}));
    if (!res.ok || r.error) document.getElementById('err').textContent = 'Unverify failed: ' + (r.error || res.status);
    load();
  }

  load();
</script>
</body>
</html>
