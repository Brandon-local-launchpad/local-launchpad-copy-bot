<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign in · Copybot</title>
<link rel="icon" href="/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/app/app.css">
<style>
  .login { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 16px; background: var(--bg); }
  .login-card { width: 100%; max-width: 380px; background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow); padding: 28px; }
  .login-logo { display: flex; align-items: center; gap: 12px; margin-bottom: 20px; }
  .login-logo img { width: 44px; height: 44px; border-radius: 10px; }
  .login-logo strong { font-size: 16px; display: block; }
  .login-logo span { color: var(--muted); font-size: 13px; }
  .login .btn { width: 100%; padding: 10px; }
  .err { color: #b91c1c; font-size: 13px; margin-bottom: 12px; display: none; }
  .err.show { display: block; }
</style>
</head>
<body>
<div class="login">
  <form class="login-card" method="post" action="/auth/login">
    <div class="login-logo"><img src="/logo.png" alt=""><div><strong>Local Launchpad</strong><span>Copybot</span></div></div>
    <div class="err" id="err">That password is not right.</div>
    <div class="field"><label for="password">Password</label><input class="input" type="password" id="password" name="password" autocomplete="current-password" autofocus required></div>
    <button class="btn btn-primary" type="submit">Sign in</button>
  </form>
</div>
<script>if (new URLSearchParams(location.search).get('error')) document.getElementById('err').classList.add('show');</script>
</body>
</html>
