<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Submissions — Local Launchpad</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #0f1117; --surface: #1a1d27; --surface2: #22263a;
    --accent: #6c63ff; --accent2: #5a52e0; --success: #4ade80;
    --danger: #f87171; --warning: #fbbf24; --text: #e2e8f0; --muted: #94a3b8;
    --border: #2d3148; --r: 10px; --font: 'Inter', system-ui, sans-serif;
  }
  body { background: var(--bg); color: var(--text); font-family: var(--font); min-height: 100vh; padding: 2rem; font-size: 14px; }
  @media (max-width: 640px) { body { padding: 1rem; } }
  a { color: var(--accent); text-decoration: none; }
  .breadcrumb { color: var(--muted); font-size: 13px; margin-bottom: 1.5rem; }
  .breadcrumb a { color: var(--muted); }
  .header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 1.5rem; gap: 1rem; flex-wrap: wrap; }
  h1 { font-size: 1.5rem; font-weight: 700; }
  .sub { color: var(--muted); font-size: 13px; margin-top: 3px; }
  .btn { display: inline-flex; align-items: center; gap: 6px; border: none; border-radius: var(--r); font-family: var(--font); font-size: 13px; font-weight: 600; padding: 7px 13px; cursor: pointer; text-decoration: none; }
  .btn-ghost { background: transparent; color: var(--muted); border: 1px solid var(--border); }
  .btn-ghost:hover { color: var(--text); }
  .list { display: grid; gap: .6rem; }
  .row { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r); padding: 1rem 1.25rem; display: grid; grid-template-columns: 2fr 1.2fr 1.2fr .9fr .9fr auto; gap: 1rem; align-items: center; cursor: pointer; }
  .row:hover { border-color: var(--accent); }
  .row.head { background: transparent; border: none; color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .04em; cursor: default; padding-top: 0; padding-bottom: 0; }
  @media (max-width: 900px) { .row { grid-template-columns: 1fr 1fr; } .row.head { display: none; } }
  .name { font-weight: 600; }
  .meta { color: var(--muted); font-size: 12px; margin-top: 2px; }
  .badge { display: inline-block; border-radius: 20px; padding: 3px 10px; font-size: 11px; font-weight: 700; white-space: nowrap; }
  .b-received { background: var(--surface2); color: var(--muted); }
  .b-processed { background: rgba(74,222,128,.15); color: var(--success); }
  .b-error, .b-rejected { background: rgba(248,113,113,.15); color: var(--danger); }
  .b-warn { background: rgba(251,191,36,.15); color: var(--warning); }
  .pct { display: flex; align-items: center; gap: 8px; }
  .bar { flex: 1; height: 6px; background: var(--surface2); border-radius: 3px; overflow: hidden; min-width: 40px; }
  .bar > div { height: 100%; background: var(--accent); }
  .empty { color: var(--muted); text-align: center; padding: 3rem; }
  .err { color: var(--danger); font-size: 12px; margin-top: 4px; white-space: pre-wrap; word-break: break-word; max-height: 4.5em; overflow: hidden; }
</style>
</head>
<body>

<div class="breadcrumb"><a href="/clients.html">← Clients</a></div>
<div class="header">
  <div>
    <h1>Fillout submissions</h1>
    <div class="sub">Every onboarding form delivered to <code>/api/webhooks/fillout</code>, newest first. Click a row for the client record.</div>
  </div>
  <button class="btn btn-ghost" onclick="load()">Refresh</button>
</div>

<div class="list" id="list"><div class="empty">Loading…</div></div>

<script>
  const esc = s => String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  const fmt = s => s ? new Date(s).toLocaleString('en-GB', { day:'numeric', month:'short', year:'numeric', hour:'2-digit', minute:'2-digit' }) : '';

  async function load() {
    const res = await fetch('/api/fillout/submissions');
    if (!res.ok) { document.getElementById('list').innerHTML = `<div class="empty">Could not load: ${esc((await res.json().catch(() => ({}))).error || res.status)}</div>`; return; }
    const { submissions } = await res.json();
    const list = document.getElementById('list');
    if (!submissions.length) { list.innerHTML = '<div class="empty">No submissions yet. Point the Fillout webhook at /api/webhooks/fillout with the shared secret.</div>'; return; }
    list.innerHTML = `<div class="row head"><div>Business</div><div>Niche</div><div>Received</div><div>Status</div><div>Complete</div><div></div></div>` +
      submissions.map(s => {
        const flags = [];
        if (s.duplicateOf) flags.push(`<span class="badge b-warn" title="Name or email matched another client, but not both">Possible duplicate of ${esc(s.duplicateOf.name || 'another client')}</span>`);
        if (s.audioFailed) flags.push(`<span class="badge b-warn">${s.audioFailed} audio download${s.audioFailed > 1 ? 's' : ''} to retry</span>`);
        if (s.niche && !s.nicheKnown) flags.push(`<span class="badge b-warn" title="Only the universal fields were read">No field map for this niche</span>`);
        if (s.archived) flags.push(`<span class="badge b-received">Archived</span>`);
        const c = s.completeness;
        const pct = c ? `<div class="pct"><div class="bar"><div style="width:${c.pct}%"></div></div><span>${c.pct}%</span></div><div class="meta">${c.filled} of ${c.expected} expected${c.optionalTotal ? ` · ${c.optionalFilled} of ${c.optionalTotal} optional` : ''}</div>` : '<span class="meta">—</span>';
        const open = s.clientId ? `onclick="location.href='/client-record.html?id=${s.clientId}'"` : '';
        // Reprocess rebuilds the record from the stored payload (after a field map change, a failed run or a failed audio download)
        const canRerun = s.status !== 'rejected';
        const rerunLabel = s.status === 'error' || s.audioFailed || s.status === 'received' ? 'Re-run' : 'Reprocess';
        return `<div class="row" ${open}>
          <div><div class="name">${esc(s.businessName || '(no business name)')}</div><div class="meta">${esc(s.submissionId)}${flags.length ? '<br>' + flags.join(' ') : ''}</div></div>
          <div>${esc(s.niche || '—')}</div>
          <div>${fmt(s.receivedAt)}</div>
          <div><span class="badge b-${esc(s.status)}">${esc(s.status)}</span>${s.error ? `<div class="err" title="${esc(s.error)}">${esc(s.error.split('\n')[0])}</div>` : ''}</div>
          <div>${pct}</div>
          <div onclick="event.stopPropagation()" style="display:flex;gap:6px;flex-wrap:wrap">
            ${canRerun ? `<button class="btn btn-ghost" title="Rebuild the client record from the stored submission. Fields typed in by hand are kept." onclick="rerun('${s.id}')">${rerunLabel}</button>` : ''}
            ${s.archived && s.clientId ? `<button class="btn btn-ghost" onclick="unarchive('${s.clientId}')">Unarchive</button>` : ''}
          </div>
        </div>`;
      }).join('');
  }

  async function rerun(id) {
    const res = await fetch(`/api/fillout/submissions/${id}/reprocess`, { method: 'POST' });
    const r = await res.json().catch(() => ({}));
    if (!res.ok || r.error) alert('Re-run failed: ' + (r.error || res.status));
    load();
  }
  async function unarchive(clientId) { await fetch(`/api/clients/${clientId}/unarchive`, { method: 'POST' }); load(); }

  load();
</script>
</body>
</html>
