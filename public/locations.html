<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Locations — Local Launchpad</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #0f1117; --surface: #1a1d27; --surface2: #22263a;
    --accent: #6c63ff; --accent2: #5a52e0; --success: #4ade80;
    --danger: #f87171; --warning: #fbbf24; --text: #e2e8f0; --muted: #94a3b8;
    --border: #2d3148; --r: 10px; --font: 'Inter', system-ui, sans-serif;
    --t1: #a78bfa; --t2: #38bdf8; --area: #94a3b8; --excl: #f87171;
  }
  body { background: var(--bg); color: var(--text); font-family: var(--font); min-height: 100vh; padding: 2rem; font-size: 14px; }
  @media (max-width: 640px) { body { padding: 1rem; } }
  a { color: var(--accent); text-decoration: none; }
  .breadcrumb { color: var(--muted); font-size: 13px; margin-bottom: 1.5rem; }
  .breadcrumb a { color: var(--muted); }
  .header { display: flex; align-items: flex-start; justify-content: space-between; margin-bottom: 1rem; gap: 1rem; flex-wrap: wrap; }
  h1 { font-size: 1.5rem; font-weight: 700; }
  h2 { font-size: 1.05rem; font-weight: 700; margin: 1.5rem 0 .5rem; display: flex; align-items: center; gap: .6rem; }
  .sub { color: var(--muted); font-size: 13px; margin-top: 3px; max-width: 90ch; line-height: 1.5; }
  .btn { display: inline-flex; align-items: center; gap: 6px; border: none; border-radius: var(--r); font-family: var(--font); font-size: 13px; font-weight: 600; padding: 7px 13px; cursor: pointer; text-decoration: none; }
  .btn-ghost { background: transparent; color: var(--muted); border: 1px solid var(--border); }
  .btn-ghost:hover { color: var(--text); }
  .btn-primary { background: var(--accent); color: #fff; }
  .btn-primary:hover { background: var(--accent2); }
  .btn-danger { background: transparent; color: var(--danger); border: 1px solid var(--danger); }
  .btn:disabled { opacity: .45; cursor: default; }
  .btn-sm { padding: 3px 8px; font-size: 11px; border-radius: 6px; }
  input, select, textarea { background: var(--surface); color: var(--text); border: 1px solid var(--border); border-radius: var(--r); padding: 6px 10px; font-family: var(--font); font-size: 13px; }
  textarea { width: 100%; min-height: 12rem; line-height: 1.5; }
  .notice { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r); padding: .75rem 1rem; font-size: 13px; margin-bottom: .75rem; }
  .notice.warn { border-color: var(--warning); }
  .notice.fail { border-color: var(--danger); }
  .notice.ok { border-color: var(--success); }
  .grid { display: grid; grid-template-columns: 1.4fr 1fr; gap: 1.25rem; align-items: start; }
  @media (max-width: 1000px) { .grid { grid-template-columns: 1fr; } }
  #map { height: 540px; border-radius: var(--r); border: 1px solid var(--border); background: #111; }
  .legend { display: flex; gap: 1rem; flex-wrap: wrap; color: var(--muted); font-size: 12px; margin-top: .5rem; align-items: center; }
  .dot { display: inline-block; width: 11px; height: 11px; border-radius: 50%; margin-right: 5px; vertical-align: -1px; border: 1px solid rgba(255,255,255,.4); }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r); padding: 1rem 1.25rem; margin-bottom: 1rem; }
  .card h3 { font-size: .95rem; font-weight: 700; margin-bottom: .5rem; }
  .counts { display: grid; grid-template-columns: repeat(4, 1fr); gap: .5rem; margin-bottom: .75rem; }
  .count { background: var(--surface2); border-radius: var(--r); padding: .6rem .75rem; }
  .count b { display: block; font-size: 1.3rem; }
  .count span { color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: .04em; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th { text-align: left; color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: .04em; padding: .5rem .5rem; border-bottom: 1px solid var(--border); }
  td { padding: .5rem .5rem; border-bottom: 1px solid var(--border); vertical-align: top; }
  tr.sec td { background: var(--surface2); font-weight: 700; padding: .55rem .5rem; }
  .why { color: var(--muted); font-size: 12px; max-width: 46ch; }
  .badge { display: inline-block; border-radius: 20px; padding: 2px 8px; font-size: 10px; font-weight: 700; white-space: nowrap; margin-left: 4px; vertical-align: 1px; }
  .b-t1 { background: rgba(167,139,250,.18); color: var(--t1); }
  .b-t2 { background: rgba(56,189,248,.18); color: var(--t2); }
  .b-area { background: rgba(148,163,184,.18); color: var(--area); }
  .b-excl { background: rgba(248,113,113,.18); color: var(--excl); }
  .b-warn { background: rgba(251,191,36,.15); color: var(--warning); }
  .b-ok { background: rgba(74,222,128,.15); color: var(--success); }
  .moves { white-space: nowrap; }
  .moves .btn { margin-right: 3px; }
  .moves .on { background: var(--surface2); color: var(--text); border-color: var(--accent); }
  .num { text-align: right; font-variant-numeric: tabular-nums; }
  .reply label { display: flex; align-items: center; gap: .5rem; padding: 3px 0; }
  .suggest { position: relative; }
  .suggest ul { position: absolute; left: 0; right: 0; top: 100%; z-index: 5; background: var(--surface2); border: 1px solid var(--border); border-radius: var(--r); list-style: none; max-height: 14rem; overflow: auto; }
  .suggest li { padding: 6px 10px; cursor: pointer; font-size: 13px; }
  .suggest li:hover { background: var(--surface); }
  .muted { color: var(--muted); }
  .leaflet-container { font-family: var(--font); }
  .leaflet-popup-content { font-size: 13px; color: #111; }
  .leaflet-popup-content .btn { color: #fff; }
  .mono { font-family: monospace; font-size: 12px; }
  .toolbar { display: flex; gap: .5rem; flex-wrap: wrap; align-items: center; margin: .5rem 0 1rem; }
</style>
</head>
<body>
<div class="breadcrumb"><a href="/clients.html">← Clients</a> · <a id="clientLink" href="#">Client</a></div>
<div class="header">
  <div>
    <h1 id="title">Locations</h1>
    <div class="sub" id="sub">Which towns get location pages, and when. The tiers are the launch phases: Tier 1 launches first, Tier 2 in phase 2, area only is named on the site and the Google Business Profile but gets no page.</div>
  </div>
  <div class="toolbar">
    <button class="btn btn-ghost" id="dryBtn">Dry run (free)</button>
    <button class="btn btn-ghost" id="runBtn" disabled>Run (buys)</button>
    <label class="muted" style="font-size:12px"><input type="checkbox" id="showExcl"> show excluded</label>
  </div>
</div>
<div id="notices"></div>
<div id="app"></div>

<script>
(function () {
  const params = new URLSearchParams(location.search);
  const clientId = params.get('id');
  const api = p => `/api/clients/${clientId}/locations${p}`;
  const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const num = v => v == null ? '' : Number(v).toLocaleString('en-GB');
  const LABEL = { tier1: 'Tier 1', tier2: 'Tier 2', area_only: 'Area only', excluded: 'Excluded' };
  const COLOUR = { tier1: '#a78bfa', tier2: '#38bdf8', area_only: '#94a3b8', excluded: '#f87171' };
  const BADGE = { tier1: 'b-t1', tier2: 'b-t2', area_only: 'b-area', excluded: 'b-excl' };
  let view = null, dry = null, map = null, layer = null, leafletLoading = null;

  const notices = document.getElementById('notices');
  const app = document.getElementById('app');
  const showExcl = document.getElementById('showExcl');
  showExcl.onchange = () => render();

  async function post(path, body) {
    const r = await fetch(api(path), { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body || {}) });
    const j = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(j.error || r.statusText);
    return j;
  }
  async function load() {
    const r = await fetch(api('/review'));
    view = await r.json();
    try { const c = await (await fetch(`/api/clients/${clientId}`)).json(); if (c && c.name) { document.getElementById('title').textContent = `Locations: ${c.name}`; document.getElementById('clientLink').textContent = c.name; } } catch (_) {}
    document.getElementById('clientLink').href = `/client.html?id=${clientId}`;
    render();
  }

  function gateText(t) {
    if (!t.gate) return t.source === 'manual' ? 'added by hand' : '';
    const g = t.gate;
    const v = g.volume == null ? 'volume ?' : `volume ${g.volume}`;
    const c = g.competitors == null ? '' : `, ${g.competitors} competitor page${g.competitors === 1 ? '' : 's'}`;
    if (t.population_rule) return `population ${num(t.population)} (${v}${c})`;
    return g.pass ? `${g.by} (${v}${c})` : `${v}${c}`;
  }

  function render() {
    notices.innerHTML = '';
    if (!view) return;
    if (!view.ok) {
      notices.innerHTML = view.problems.map(p => `<div class="notice warn">${esc(p.msg)}</div>`).join('');
      app.innerHTML = dry ? dryHtml() : '';
      document.getElementById('runBtn').disabled = !dry || !dry.ok;
      return;
    }
    document.getElementById('runBtn').disabled = !dry || !dry.ok;
    const v = view;
    const f = v.flags.map(x => `<div class="notice warn">${esc(x.code)}: ${esc(x.msg)}</div>`).join('');
    const w = v.warnings.map(x => `<div class="notice ${x.code === 'over_cap' ? 'fail' : 'warn'}">${esc(x.msg)}</div>`).join('');
    const a = v.approval ? `<div class="notice ok">Approved ${esc(new Date(v.approval.approved_at).toLocaleString('en-GB'))}${v.approval.approved_by ? ` by ${esc(v.approval.approved_by)}` : ''}: ${v.approval.counts.tier1} Tier 1, ${v.approval.counts.tier2} Tier 2, ${v.approval.counts.area_only} area only. Stage 6 reads this list for the page map and the GBP service areas.</div>` : `<div class="notice">Not approved yet. Move towns, add any missing, send the client message, record the reply, then Approve.</div>`;
    notices.innerHTML = `<div class="notice">Run of ${esc(new Date(v.ran_at).toLocaleString('en-GB'))}. Base <b>${esc(v.base.name)}</b> (population ${num(v.base.population)}), point from ${esc(v.point.from)}. Travel ${v.travel.miles} miles from ${esc(v.travel.from)} → reach ${v.reach_miles} mi, outer limit ${v.outer_limit_miles} mi, Tier 1 band ${v.tier1_band.join(' to ')}, page town cap ${v.page_town_cap}.${v.costs ? ` This run cost $${Number(v.costs.total_usd).toFixed(2)}.` : ''}${v.scan ? ` <span class="muted">Locked scan grid: ${v.scan.reach_miles} mi would move ${v.scan.moves.length} towns (shown only, never applied).</span>` : ''}</div>` + f + w + a + (dry ? dryHtml() : '');

    const list = v.list.filter(t => showExcl.checked || t.to !== 'excluded');
    const sections = ['tier1', 'tier2', 'area_only', 'excluded'];
    const rows = sections.map(sec => {
      const items = list.filter(t => t.to === sec);
      if (!items.length) return '';
      const title = { tier1: 'Tier 1: phase 1 location pages', tier2: 'Tier 2: phase 2 location pages', area_only: 'Area only: service areas text and GBP, no page', excluded: 'Excluded' }[sec];
      return `<tr class="sec"><td colspan="9">${esc(title)} <span class="muted">(${items.length})</span></td></tr>` + items.map(rowHtml).join('');
    }).join('');

    app.innerHTML = `
      <div class="grid">
        <div>
          <div id="map"></div>
          <div class="legend"><span><i class="dot" style="background:${COLOUR.tier1}"></i>Tier 1</span><span><i class="dot" style="background:${COLOUR.tier2}"></i>Tier 2</span><span><i class="dot" style="background:${COLOUR.area_only}"></i>area only</span><span><i class="dot" style="background:${COLOUR.excluded}"></i>excluded (when shown)</span><span>★ base · solid ring reach · dashed ring outer limit · small dots are districts</span></div>
        </div>
        <div>
          <div class="card">
            <div class="counts">
              <div class="count"><b style="color:${COLOUR.tier1}">${v.counts.tier1}</b><span>Tier 1</span></div>
              <div class="count"><b style="color:${COLOUR.tier2}">${v.counts.tier2}</b><span>Tier 2</span></div>
              <div class="count"><b>${v.counts.area_only}</b><span>area only</span></div>
              <div class="count"><b>${v.counts.moved + v.counts.manual}</b><span>by hand</span></div>
            </div>
            <div class="muted" style="font-size:12px">${v.counts.tier1 + v.counts.tier2} page towns of ${v.page_town_cap}; ${v.location_categories.length} location category pages; ${v.counts.declined} declined by the client.</div>
          </div>
          <div class="card">
            <h3>Add a place by hand</h3>
            <div class="suggest" style="display:flex;gap:.5rem;align-items:center">
              <input id="addName" placeholder="Town or suburb name" style="flex:1" autocomplete="off">
              <select id="addTo"><option value="tier2">Tier 2</option><option value="tier1">Tier 1</option><option value="area_only">Area only</option></select>
              <button class="btn btn-primary" id="addBtn">Add</button>
              <ul id="suggestList" hidden></ul>
            </div>
            <div class="muted" style="font-size:12px;margin-top:.4rem">Matched in the places table nearest the base. A place the run already judged is moved instead.</div>
          </div>
          <div class="card">
            <h3>GBP service areas (${v.gbp_areas.length} of 20)</h3>
            <div style="font-size:13px;line-height:1.6">${v.gbp_areas.map(g => `${esc(g.name)} <span class="badge ${g.from === 'Tier 1' ? 'b-t1' : g.from === 'Tier 2' ? 'b-t2' : 'b-area'}">${esc(g.from)}</span>`).join(' · ')}</div>
          </div>
          <div class="card">
            <h3>Approve</h3>
            <div style="display:flex;gap:.5rem;align-items:center;flex-wrap:wrap">
              <input id="who" placeholder="Your name" style="width:11rem" value="${esc(localStorage.getItem('ll_who') || '')}">
              <button class="btn btn-primary" id="approveBtn" ${v.warnings.some(x => x.code === 'over_cap') ? 'disabled' : ''}>Approve this list</button>
            </div>
            <div class="muted" style="font-size:12px;margin-top:.4rem">Writes the approved list with a timestamp. The page map and GBP read it in Stage 6; approving again replaces it.</div>
          </div>
        </div>
      </div>

      <h2>Towns <span class="muted" style="font-size:12px;font-weight:400">move a town with the buttons; Reset returns it to the run's decision</span></h2>
      <table>
        <thead><tr><th>Place</th><th>Type</th><th class="num">Population</th><th class="num">Miles</th><th class="num">Namesakes</th><th class="num">Score</th><th>Evidence</th><th>Why</th><th>Move</th></tr></thead>
        <tbody>${rows}</tbody>
      </table>

      <div class="grid" style="margin-top:1.5rem">
        <div class="card">
          <h3>Client confirmation message <button class="btn btn-ghost btn-sm" id="copyMsg">Copy</button></h3>
          <textarea id="msg" readonly>${esc(v.message.text)}</textarea>
        </div>
        <div class="card reply">
          <h3>The client's reply</h3>
          <div class="muted" style="font-size:12px;margin-bottom:.5rem">Untick the towns the client said they do not work in. They become area only, and the reply is kept as presence evidence.</div>
          ${v.message.towns.map(t => `<label><input type="checkbox" data-id="${esc(t.place_id)}" ${(v.state.client_reply && v.state.client_reply.declined.includes(t.place_id)) ? '' : 'checked'}> ${esc(t.name)} <span class="badge ${t.tier === 1 ? 'b-t1' : 'b-t2'}">Tier ${t.tier}</span></label>`).join('')}
          ${(v.list.filter(t => t.client_declined && !t.tier)).map(t => `<label><input type="checkbox" data-id="${esc(t.place_id)}"> ${esc(t.name)} <span class="badge b-area">declined, area only</span></label>`).join('')}
          <div style="display:flex;gap:.5rem;align-items:center;margin-top:.6rem"><input id="replyNote" placeholder="Note (how the client replied)" style="flex:1" value="${esc(v.state.client_reply ? v.state.client_reply.note : '')}"><button class="btn btn-ghost" id="replyBtn">Save reply</button></div>
          ${v.state.client_reply ? `<div class="muted" style="font-size:12px;margin-top:.4rem">Reply recorded ${esc(new Date(v.state.client_reply.at).toLocaleString('en-GB'))}: ${v.state.client_reply.declined.length} declined.</div>` : ''}
        </div>
      </div>

      <h2>Location category pages <span class="muted" style="font-size:12px;font-weight:400">per page town, each on its own demand; the primary category on the location page's</span></h2>
      <div class="card" style="font-size:13px;line-height:1.7">${catsHtml(v)}</div>`;

    wire();
    drawMap();
  }

  function rowHtml(t) {
    const badges = [t.client_asked ? '<span class="badge b-warn">typed by client</span>' : '', t.source === 'manual' ? '<span class="badge b-warn">by hand</span>' : '', t.ambiguous ? `<span class="badge b-warn" title="${esc((t.namesake_examples || []).join(', '))}">shared name</span>` : '', t.client_declined ? '<span class="badge b-excl">client declined</span>' : '', t.moved ? '<span class="badge b-ok">moved</span>' : '', t.population_rule && !t.moved ? '<span class="badge b-t2">population</span>' : ''].join('');
    const moves = ['tier1', 'tier2', 'area_only', 'excluded'].map(to => `<button class="btn btn-ghost btn-sm ${t.to === to ? 'on' : ''}" data-move="${to}" data-id="${esc(t.place_id)}" ${t.to === to ? 'disabled' : ''}>${{ tier1: 'T1', tier2: 'T2', area_only: 'Area', excluded: 'Excl' }[to]}</button>`).join('') + (t.moved ? `<button class="btn btn-ghost btn-sm" data-move="reset" data-id="${esc(t.place_id)}">Reset</button>` : '');
    return `<tr data-row="${esc(t.place_id)}"><td><b>${esc(t.name)}</b>${t.qualifier ? ` <span class="muted">(${esc(t.qualifier)})</span>` : ''}${badges}</td><td class="muted">${esc(t.type)}</td><td class="num">${num(t.population)}</td><td class="num">${t.miles == null ? '' : t.miles}${t.inside_reach === false ? ' <span class="muted">beyond</span>' : ''}</td><td class="num">${t.namesakes || 0}</td><td class="num">${t.score == null ? '' : t.score}</td><td class="muted">${esc(gateText(t))}</td><td class="why">${esc(t.why)}</td><td class="moves">${moves}</td></tr>`;
  }

  function catsHtml(v) {
    const by = new Map();
    for (const c of v.location_categories) { if (!by.has(c.town)) by.set(c.town, []); by.get(c.town).push(c); }
    if (!by.size) return '<span class="muted">None pass yet.</span>';
    return [...by].map(([town, list]) => `<b>${esc(town)}</b> <span class="badge ${list[0].phase === 1 ? 'b-t1' : 'b-t2'}">phase ${list[0].phase}</span>: ${list.map(c => `${esc(c.category)}${c.primary ? '*' : ''} <span class="muted">(${c.by === 'volume' ? `v ${c.volume}` : c.by === 'population' ? 'population' : `c ${c.competitors}`})</span>`).join(', ')}`).join('<br>') + '<br><span class="muted">* the primary category, on the location page\'s evidence (hub rule)</span>';
  }

  function dryHtml() {
    if (!dry) return '';
    if (!dry.ok) return `<div class="notice fail">Dry run: ${dry.problems.map(p => esc(p.msg)).join(' ')}</div>`;
    const c = dry.counts, e = dry.estimate;
    return `<div class="notice">Dry run: ${c.candidates} candidates in the volume run (${c.inside_reach} inside reach, ${c.districts_of_base} districts), ${c.area_only} area only, ${c.excluded} excluded (${c.across_water} across water). ${dry.plan.keyword_count} keywords (${dry.plan.keywords_to_buy} to buy), up to ${dry.plan.serp_to_buy} SERPs to buy. <b>Estimate up to $${Number(e.total_usd).toFixed(2)}</b>. Run buys that and saves a new run.</div>`;
  }

  function wire() {
    for (const b of app.querySelectorAll('[data-move]')) b.onclick = async () => { try { view = await post('/review/move', { place_id: b.dataset.id, to: b.dataset.move }); render(); } catch (e) { alert(e.message); } };
    const addName = document.getElementById('addName'), sug = document.getElementById('suggestList');
    let timer = null, picked = null;
    addName.oninput = () => { picked = null; clearTimeout(timer); const q = addName.value.trim(); if (q.length < 2) { sug.hidden = true; return; } timer = setTimeout(async () => { const r = await fetch(api('/review/suggest?q=' + encodeURIComponent(q))); const items = await r.json(); sug.innerHTML = items.map(i => `<li data-id="${esc(i.place_id)}" data-name="${esc(i.name)}">${esc(i.name)}${i.qualifier ? ` (${esc(i.qualifier)})` : ''} <span class="muted">${esc(i.type)}${i.population ? `, ${num(i.population)}` : ''}${i.miles != null ? `, ${i.miles} mi` : ''}, ${esc(String(i.lad_name || '').split(';')[0])}</span></li>`).join('') || '<li class="muted">nothing of that name</li>'; sug.hidden = false; for (const li of sug.querySelectorAll('li[data-id]')) li.onclick = () => { picked = li.dataset.id; addName.value = li.dataset.name; sug.hidden = true; }; }, 250); };
    document.getElementById('addBtn').onclick = async () => { const name = addName.value.trim(); if (!name) return; try { view = await post('/review/add', picked ? { place_id: picked, to: document.getElementById('addTo').value } : { name, to: document.getElementById('addTo').value }); render(); } catch (e) { alert(e.message); } };
    document.getElementById('copyMsg').onclick = async () => { const b = document.getElementById('copyMsg'); try { await navigator.clipboard.writeText(document.getElementById('msg').value); b.textContent = 'Copied'; setTimeout(() => { b.textContent = 'Copy'; }, 1500); } catch (_) { document.getElementById('msg').select(); } };
    document.getElementById('replyBtn').onclick = async () => { const declined = [...app.querySelectorAll('.reply input[type=checkbox]')].filter(c => !c.checked).map(c => c.dataset.id); try { view = await post('/review/client-reply', { declined, note: document.getElementById('replyNote').value }); render(); } catch (e) { alert(e.message); } };
    document.getElementById('approveBtn').onclick = async () => { const who = document.getElementById('who').value.trim(); localStorage.setItem('ll_who', who); if (!confirm(`Approve ${view.counts.tier1} Tier 1 and ${view.counts.tier2} Tier 2 towns for ${view.client.name}?`)) return; try { view = await post('/review/approve', { who }); render(); } catch (e) { alert(e.message); } };
  }

  function loadLeaflet() {
    if (window.L) return Promise.resolve();
    if (leafletLoading) return leafletLoading;
    leafletLoading = new Promise((resolve, reject) => { const s = document.createElement('script'); s.src = 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js'; s.onload = resolve; s.onerror = () => reject(new Error('Leaflet did not load')); document.head.appendChild(s); });
    return leafletLoading;
  }
  async function drawMap() {
    const el = document.getElementById('map');
    if (!el || !view || !view.ok) return;
    try { await loadLeaflet(); } catch (e) { el.textContent = e.message; return; }
    if (map) { map.remove(); map = null; }
    const v = view;
    // The wheel scrolls the page until the map is clicked (Brandon, 30 Oct); leaving the map hands the wheel back
    map = L.map(el, { zoomControl: true, scrollWheelZoom: false });
    map.on('click', () => map.scrollWheelZoom.enable());
    map.on('mouseout', () => map.scrollWheelZoom.disable());
    L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19, attribution: '&copy; OpenStreetMap contributors' }).addTo(map);
    const base = [v.point.lat, v.point.lng];
    const mi = 1609.344;
    L.circle(base, { radius: v.reach_miles * mi, color: '#6c63ff', weight: 2, fill: false }).addTo(map);
    L.circle(base, { radius: v.outer_limit_miles * mi, color: '#6c63ff', weight: 1.5, dashArray: '6 8', fill: false }).addTo(map);
    L.marker(base, { icon: L.divIcon({ className: '', html: '<div style="font-size:22px;line-height:22px;color:#fbbf24;text-shadow:0 0 3px #000">★</div>', iconSize: [22, 22], iconAnchor: [11, 11] }) }).addTo(map).bindPopup(`<b>${esc(v.base.name)}</b><br>base, point from ${esc(v.point.from)}`);
    const pts = [base];
    for (const t of v.list) {
      if (t.lat == null || t.lng == null) continue;
      if (t.to === 'excluded' && !showExcl.checked) continue;
      const r = t.type === 'district' ? 5 : t.to === 'tier1' ? 11 : t.to === 'tier2' ? 9 : 7;
      const m = L.circleMarker([t.lat, t.lng], { radius: r, color: '#0f1117', weight: 1, fillColor: COLOUR[t.to], fillOpacity: t.to === 'area_only' ? .7 : .95 }).addTo(map);
      m.bindPopup(`<b>${esc(t.name)}</b> ${esc(LABEL[t.to])}<br>${esc(t.type)}${t.population ? `, population ${num(t.population)}` : ''}, ${t.miles} mi, ${t.namesakes || 0} namesakes<br><span style="color:#555">${esc(gateText(t))}</span><br><span style="color:#555">${esc(t.why)}</span><br><div style="margin-top:6px">${['tier1', 'tier2', 'area_only', 'excluded'].filter(x => x !== t.to).map(x => `<button class="btn btn-primary btn-sm" data-pmove="${x}" data-id="${esc(t.place_id)}">${esc(LABEL[x])}</button>`).join(' ')}</div>`);
      if (t.to !== 'excluded') pts.push([t.lat, t.lng]);
    }
    map.on('popupopen', e => { for (const b of e.popup.getElement().querySelectorAll('[data-pmove]')) b.onclick = async () => { try { view = await post('/review/move', { place_id: b.dataset.id, to: b.dataset.pmove }); render(); } catch (err) { alert(err.message); } }; });
    map.fitBounds(L.latLngBounds(pts).pad(0.05));
  }

  document.getElementById('dryBtn').onclick = async () => { const b = document.getElementById('dryBtn'); b.disabled = true; b.textContent = 'Running the dry run…'; try { dry = await (await fetch(api('/dry-run'))).json(); } catch (e) { alert(e.message); } b.disabled = false; b.textContent = 'Dry run (free)'; render(); };
  document.getElementById('runBtn').onclick = async () => { if (!dry || !dry.ok) return; if (!confirm(`Buy the volumes and SERPs for this run? Estimate up to $${Number(dry.estimate.total_usd).toFixed(2)}.`)) return; const b = document.getElementById('runBtn'); b.disabled = true; b.textContent = 'Running (buying)…'; try { await post('/run', { confirm: true }); dry = null; await load(); } catch (e) { alert(e.message); } b.textContent = 'Run (buys)'; };

  if (!clientId) { notices.innerHTML = '<div class="notice fail">No client id in the address (locations.html?id=…).</div>'; }
  else load().catch(e => { notices.innerHTML = `<div class="notice fail">${esc(e.message)}</div>`; });
})();
</script>
</body>
</html>
