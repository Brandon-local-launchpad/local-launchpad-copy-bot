<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Client — Local Launchpad</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #0f1117; --surface: #1a1d27; --surface2: #22263a;
    --accent: #6c63ff; --accent2: #5a52e0; --success: #4ade80;
    --danger: #f87171; --warning: #fbbf24; --text: #e2e8f0; --muted: #94a3b8;
    --border: #2d3148; --r: 10px; --font: 'Inter', system-ui, sans-serif;
  }
  body { background: var(--bg); color: var(--text); font-family: var(--font); min-height: 100vh; padding: 2rem; }
  a { color: var(--accent); text-decoration: none; }
  a:hover { text-decoration: underline; }
  .breadcrumb { color: var(--muted); font-size: 13px; margin-bottom: 1.5rem; }
  .breadcrumb a { color: var(--muted); }
  .breadcrumb a:hover { color: var(--text); }
  .header { display: flex; align-items: flex-start; justify-content: space-between; margin-bottom: 2rem; gap: 1rem; }
  h1 { font-size: 1.5rem; font-weight: 700; }
  .client-meta { color: var(--muted); font-size: 13px; margin-top: 4px; }
  .btn { display: inline-flex; align-items: center; gap: 6px; border: none; border-radius: var(--r); font-family: var(--font); font-size: 14px; font-weight: 600; padding: 10px 18px; cursor: pointer; transition: background 0.15s; text-decoration: none; }
  .btn-primary { background: var(--accent); color: #fff; }
  .btn-primary:hover { background: var(--accent2); }
  .btn-ghost { background: transparent; color: var(--muted); border: 1px solid var(--border); }
  .btn-ghost:hover { color: var(--text); }
  .btn-sm { padding: 6px 12px; font-size: 12px; }
  .tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--border); margin-bottom: 1.5rem; }
  .tab { padding: 8px 16px; font-size: 13px; font-weight: 600; color: var(--muted); cursor: pointer; border-bottom: 2px solid transparent; margin-bottom: -1px; transition: color 0.15s; }
  .tab:hover { color: var(--text); }
  .tab.active { color: var(--accent); border-bottom-color: var(--accent); }
  .tab-count { background: var(--surface2); border-radius: 10px; padding: 1px 7px; font-size: 11px; margin-left: 4px; }
  .page-list { display: grid; gap: .75rem; }
  .page-row { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r); padding: 1rem 1.25rem; display: flex; align-items: center; justify-content: space-between; gap: 1rem; cursor: pointer; transition: border-color 0.15s; }
  .page-row:hover { border-color: var(--accent); }
  .page-title { font-weight: 600; font-size: .9rem; }
  .page-slug { color: var(--muted); font-size: 12px; font-family: monospace; margin-top: 2px; }
  .page-actions { display: flex; gap: .5rem; align-items: center; flex-shrink: 0; }
  .badge { border-radius: 20px; padding: 3px 10px; font-size: 11px; font-weight: 700; }
  .badge-ok   { background: rgba(74,222,128,.15); color: var(--success); }
  .badge-warn { background: rgba(251,191,36,.15);  color: var(--warning); }
  .badge-none { background: var(--surface2); color: var(--muted); }
  .btn-danger-sm { background: transparent; color: var(--danger); border: 1px solid transparent; border-radius: 6px; padding: 4px 8px; font-size: 12px; cursor: pointer; font-family: var(--font); font-weight: 600; }
  .btn-danger-sm:hover { border-color: var(--danger); }
  .empty { color: var(--muted); padding: 2rem; text-align: center; }
  .gen-date { color: var(--muted); font-size: 11px; }
  .badge-v20  { background: rgba(108,99,255,.15); color: var(--accent); }
    @media (max-width: 640px) { body { padding: 1rem; } .page-row { flex-wrap: wrap; } }
  /* GBP output (23 Oct): description, services and products with a copy button per field */
  .gbp { margin-top: 2.5rem; border-top: 1px solid var(--border); padding-top: 1.5rem; }
  .gbp h2 { font-size: 1.1rem; font-weight: 700; margin-bottom: .25rem; }
  .gbp .sub { color: var(--muted); font-size: 13px; margin-bottom: 1rem; }
  .gbp .steps { display: flex; gap: .5rem; flex-wrap: wrap; margin: .75rem 0 1rem; }
  .gbp .notice { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r); padding: .75rem 1rem; font-size: 13px; margin-bottom: 1rem; }
  .gbp .notice.fail { border-color: var(--danger); }
  .gbp .notice ul { margin: .4rem 0 0 1.2rem; }
  .gbp .notice li { margin: 2px 0; }
  .gbp h3 { font-size: .95rem; font-weight: 700; margin: 1.5rem 0 .5rem; display: flex; align-items: center; gap: .6rem; }
  .gbp .field { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r); padding: .75rem 1rem; margin-bottom: .6rem; }
  .gbp .field-head { display: flex; justify-content: space-between; align-items: center; gap: .75rem; margin-bottom: .35rem; }
  .gbp .field-name { font-weight: 600; font-size: 13px; }
  .gbp .field-meta { color: var(--muted); font-size: 11px; font-family: monospace; }
  .gbp .field-text { font-size: 13px; line-height: 1.5; white-space: pre-wrap; }
  .gbp .field-text a { font-family: monospace; font-size: 12px; }
  .gbp .copy { background: var(--surface2); color: var(--text); border: 1px solid var(--border); border-radius: 6px; padding: 3px 9px; font-size: 11px; font-weight: 600; cursor: pointer; font-family: var(--font); }
  .gbp .copy:hover { border-color: var(--accent); }
  .gbp .copy.done { color: var(--success); border-color: var(--success); }
  .gbp .flag { color: var(--warning); font-size: 12px; margin-top: .35rem; }
  .gbp .files a { margin-right: 1rem; font-size: 13px; }
  .gbp details summary { cursor: pointer; color: var(--muted); font-size: 13px; margin: .5rem 0; }
</style>
</head>
<body>

<div class="breadcrumb"><a href="/clients.html">← Clients</a></div>

<div class="header">
  <div>
    <h1 id="clientName">Loading…</h1>
    <div class="client-meta" id="clientMeta"></div>
  </div>
  <div style="display:flex;gap:.5rem;flex-wrap:wrap">
    <a id="settingsLink" href="#" class="btn btn-ghost">Settings</a>
    <a id="generateLink" href="#" class="btn btn-primary">Generate Pages</a>
  </div>
</div>

<div class="tabs" id="tabs"></div>
<div class="page-list" id="pageList"></div>

<div class="gbp" id="gbp">
  <h2>Google Business Profile</h2>
  <div class="sub">The description, services and products to paste into the GBP editor. Each field has a copy button. Runs description, then services, then products; a run that stops at a step picks up from that step next time.</div>
  <div id="gbpBody"><div class="empty">Loading…</div></div>
</div>

<script>
  const params   = new URLSearchParams(location.search);
  const clientId = params.get('id');
  if (!clientId) location.href = '/clients.html';

  const PAGE_TYPE_ORDER = ['homepage','category','service','location','location-category'];
  const PAGE_TYPE_LABEL = { homepage: 'Homepage', category: 'Category', service: 'Service', location: 'Location', 'location-category': 'Location-Category' };

  let allPages = [];
  let activeType = null;

  async function load() {
    const [clientRes, pagesRes, v20Res] = await Promise.all([
      fetch(`/api/clients/${clientId}`),
      fetch(`/api/clients/${clientId}/pages`),
      fetch(`/api/clients/${clientId}/v20/homepage`).catch(() => null),
    ]);
    if (!clientRes.ok) { location.href = '/clients.html'; return; }
    const client = await clientRes.json();
    allPages = (await pagesRes.json()).pages || [];
    // v20 pages open on their own page screen (v20-page.html), listed first in their tab
    const v20 = v20Res && v20Res.ok ? await v20Res.json() : null;
    if (v20 && v20.record) {
      const r = v20.record, V = r.VALIDATION || {}, m = r.meta || {};
      allPages.unshift({ v20: true, page_type: 'homepage', page_title: 'Homepage (v20)', url_slug: '/', generated_at: m.edited_at || m.generated_at,
        edited: !!m.edited_at, block: V.block, flag: V.flag, claims: r.CLAIMS && r.CLAIMS.findings ? r.CLAIMS.findings.length - ((r.CLAIMS.accepted || []).length) : null });
    }

    document.title = `${client.name} — Local Launchpad`;
    document.getElementById('clientName').textContent = client.name;
    document.getElementById('clientMeta').textContent = `${client.trade} · Created ${fmtDate(client.created_at)}`;
    // A client made by the Fillout intake: marker, link to its onboarding record, archive
    if (client.source === 'fillout') {
      const mark = document.createElement('span');
      mark.className = 'badge ' + (client.reviewed_at ? 'badge-ok' : 'badge-warn');
      mark.style.marginLeft = '8px'; mark.style.verticalAlign = 'middle';
      mark.textContent = client.reviewed_at ? 'From Fillout' : 'From Fillout, unreviewed';
      document.getElementById('clientName').appendChild(mark);
      const actions = document.getElementById('settingsLink').parentElement;
      const rec = document.createElement('a');
      rec.className = 'btn btn-ghost'; rec.href = `/client-record.html?id=${clientId}`; rec.textContent = 'Onboarding record';
      actions.insertBefore(rec, actions.firstChild);
      const arch = document.createElement('button');
      arch.className = 'btn btn-ghost'; arch.textContent = client.archived_at ? 'Unarchive' : 'Archive';
      arch.onclick = async () => {
        if (!client.archived_at && !confirm(`Archive "${client.name}"? It leaves the Clients list; the onboarding record is kept.`)) return;
        await fetch(`/api/clients/${clientId}/${client.archived_at ? 'unarchive' : 'archive'}`, { method: 'POST' });
        location.href = client.archived_at ? location.href : '/clients.html';
      };
      actions.appendChild(arch);
    } else {
      // A client set up by hand: its record holds the hand set-up and the page map
      const actions = document.getElementById('settingsLink').parentElement;
      const rec = document.createElement('a');
      rec.className = 'btn btn-ghost'; rec.href = `/client-record.html?id=${clientId}#services`; rec.textContent = 'Set-up and page map';
      actions.insertBefore(rec, actions.firstChild);
    }
    document.getElementById('generateLink').href = `/generate?clientId=${clientId}`;
    document.getElementById('settingsLink').href = `/client-settings.html?id=${clientId}`;

    const types = PAGE_TYPE_ORDER.filter(t => allPages.some(p => p.page_type === t));
    if (!activeType || !types.includes(activeType)) activeType = types[0] || null;

    renderTabs(types);
    renderPages();
  }

  function renderTabs(types) {
    const tabs = document.getElementById('tabs');
    tabs.innerHTML = types.map(t => {
      const count = allPages.filter(p => p.page_type === t).length;
      return `<div class="tab${t === activeType ? ' active' : ''}" onclick="switchTab('${t}')">
        ${PAGE_TYPE_LABEL[t]}<span class="tab-count">${count}</span>
      </div>`;
    }).join('');
  }

  function renderPages() {
    const list = document.getElementById('pageList');
    const pages = allPages.filter(p => p.page_type === activeType);
    if (!pages.length) { list.innerHTML = '<div class="empty">No pages yet.</div>'; return; }
    list.innerHTML = pages.map(p => {
      if (p.v20) {
        // No validation badge here: the stored result can be out of date, and the page screen's dry run checks with today's rules
        const v = '';
        const c = p.claims ? `<span class="badge badge-warn">${p.claims} claim${p.claims > 1 ? 's' : ''} to accept</span>` : '';
        return `<div class="page-row" onclick="location.href='/v20-page.html?clientId=${clientId}&type=homepage'">
          <div>
            <div class="page-title">${esc(p.page_title)} <span class="badge badge-v20">v20</span></div>
            <div class="page-slug">Reader view, edit fields, claims, push to WordPress, push log</div>
          </div>
          <div class="page-actions">
            <span class="gen-date">${p.edited ? 'Edited' : 'Generated'} ${fmtDate(p.generated_at)}</span>
            ${v}${c}
          </div>
        </div>`;
      }
      const issueCount = (p.issues || []).length;
      const badge = !p.generated_at
        ? `<span class="badge badge-none">Not generated</span>`
        : issueCount > 0
          ? `<span class="badge badge-warn">${issueCount} issue${issueCount > 1 ? 's' : ''}</span>`
          : `<span class="badge badge-ok">✓ Clean</span>`;
      const genDate = p.generated_at ? `<span class="gen-date">${fmtDate(p.generated_at)}</span>` : '';
      return `<div class="page-row" onclick="openPage('${p.id}')">
        <div>
          <div class="page-title">${esc(p.page_title)}</div>
          <div class="page-slug">${esc(p.url_slug || '')}</div>
        </div>
        <div class="page-actions">
          ${genDate}
          ${badge}
          <button class="btn-danger-sm" onclick="event.stopPropagation();deletePage('${p.id}','${esc(p.page_title)}')">Delete</button>
        </div>
      </div>`;
    }).join('');
  }

  function switchTab(type) { activeType = type; renderTabs(PAGE_TYPE_ORDER.filter(t => allPages.some(p => p.page_type === t))); renderPages(); }
  function openPage(id) { location.href = `/page.html?id=${id}&clientId=${clientId}`; }

  async function deletePage(id, title) {
    if (!confirm(`Delete "${title}"? This cannot be undone.`)) return;
    await fetch(`/api/clients/${clientId}/pages/${id}`, { method: 'DELETE' });
    load();
  }

  function esc(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
  function fmtDate(s) { return new Date(s).toLocaleDateString('en-GB', { day:'numeric', month:'short', year:'numeric' }); }
  function fmtTime(s) { return new Date(s).toLocaleString('en-GB', { day:'numeric', month:'short', hour:'2-digit', minute:'2-digit' }); }

  // ── GBP output (gbp/routes.js) ──
  const GBP_STEPS = [['description', 'Description'], ['services', 'Services'], ['products', 'Products']];
  let gbp = null;
  const gbpTexts = [];   // the copy buttons' texts, by index
  async function loadGbp() {
    const r = await fetch(`/api/clients/${clientId}/gbp`).catch(() => null);
    if (!r) return;
    gbp = r.ok ? await r.json() : { error: (await r.json().catch(() => ({}))).error || `HTTP ${r.status}` };
    renderGbp();
    if (typeof scheduleRefresh === 'function') scheduleRefresh();
  }
  function stepBadge(step, label) {
    const st = gbp.record && gbp.record.steps ? gbp.record.steps[step] : null;
    const cls = !st ? 'badge-none' : st.status === 'done' ? 'badge-ok' : 'badge-warn';
    const txt = !st ? 'not run' : st.status === 'done' ? `done${st.validation && st.validation.flags.length ? `, ${st.validation.flags.length} to check` : ''}` : 'failed';
    return `<span class="badge ${cls}">${label}: ${txt}</span>`;
  }
  function copyBtn(text) { gbpTexts.push(text); return `<button class="copy" onclick="gbpCopy(this, ${gbpTexts.length - 1})">Copy</button>`; }
  function field(name, text, meta, flags) {
    return `<div class="field"><div class="field-head"><span class="field-name">${esc(name)}</span><span style="display:flex;gap:.6rem;align-items:center"><span class="field-meta">${esc(meta || '')}</span>${copyBtn(text)}</span></div>
      <div class="field-text">${esc(text)}</div>${(flags || []).map(f => `<div class="flag">Check: ${esc(f.message)}</div>`).join('')}</div>`;
  }
  function renderGbp() {
    const el = document.getElementById('gbpBody');
    gbpTexts.length = 0;
    if (!gbp) return;
    if (gbp.error) { el.innerHTML = `<div class="notice fail">${esc(gbp.error)}</div>`; return; }
    const R = gbp.record, rd = gbp.readiness || {};
    const steps = (R && R.steps) || {};
    const allDone = GBP_STEPS.every(([s]) => steps[s] && steps[s].status === 'done');
    const failed = GBP_STEPS.map(([s]) => s).find(s => steps[s] && steps[s].status === 'failed');
    const H = [];
    // A rank drop (batch 3) sits at the top of the section
    const SA = (gbp.scans && gbp.scans.alerts) || [];
    if (SA.length) H.push(`<div class="notice fail"><strong>Rank drop</strong><ul>${SA.map(a => `<li>${esc(a.line)} (${esc(a.previous_month)} to ${esc(a.month)})</li>`).join('')}</ul></div>`);
    H.push(`<div style="display:flex;gap:.5rem;flex-wrap:wrap;align-items:center">
      <button class="btn btn-primary" id="gbpRun" onclick="runGbp()" ${rd.ok === false || gbp.running ? 'disabled' : ''}>${gbp.running ? 'Running…' : allDone ? 'Generate GBP again' : R ? 'Generate GBP (resume)' : 'Generate GBP'}</button>
      ${R ? `<button class="btn btn-ghost btn-sm" onclick="clearGbp()">Start again</button>` : ''}
      ${R && R.updated_at ? `<span class="gen-date">Last run ${fmtTime(R.updated_at)}</span>` : ''}
    </div>`);
    H.push(`<div class="steps">${GBP_STEPS.map(([s, l]) => stepBadge(s, l)).join('')}</div>`);
    if (rd.error) H.push(`<div class="notice fail">${esc(rd.error)}</div>`);
    else {
      const bits = [`${rd.locked} service pages in the page map`, `services target ${rd.minServices}${rd.competitorCount !== null && rd.competitorCount !== undefined ? ` (competitors average ${rd.competitorCount})` : ' (no competitor count saved)'}`, rd.siteUrl ? `site ${rd.siteUrl}` : 'no site URL saved', `${rd.withCopy} service pages with copy`, `prices ${rd.showPrices ? 'shown' : 'hidden'}`];
      H.push(`<div class="notice">${esc(bits.join(' · '))}${(rd.flags || []).length ? `<ul>${rd.flags.map(f => `<li>${esc(f.msg)}</li>`).join('')}</ul>` : ''}</div>`);
    }
    if (failed) {
      const st = steps[failed];
      H.push(`<div class="notice fail"><strong>${esc(st.error)}</strong><ul>${st.fails.map(f => `<li>${esc(f.message)}</li>`).join('')}</ul>
        <details><summary>The model's answer</summary><pre class="field-text" style="max-height:300px;overflow:auto">${esc(st.raw || '')}</pre></details></div>`);
    }
    if (Object.keys(gbp.files || {}).length) H.push(`<div class="files">Files: ${Object.entries(gbp.files).map(([f, u]) => `<a href="${u}" target="_blank">${f}</a>`).join('')}</div>`);
    // Profile fields, NAP, the internal note and the review templates (batch 1): live from the record
    const P = gbp.profile;
    if (P) {
      H.push(`<h3>Profile fields <span class="badge badge-v20">paste into the GBP editor, top to bottom</span></h3>`);
      if (P.flags.length) H.push(`<div class="notice"><ul>${P.flags.map(f => `<li>${esc(f.msg)}</li>`).join('')}</ul></div>`);
      for (const f of P.fields) H.push(field(f.label, f.value || '(blank)', f.lines ? `${f.lines.length} lines` : `${[...(f.value || '')].length} characters`, f.flag ? [{ message: f.flag }] : []));
      H.push(`<h3>NAP record <span class="field-meta">nap.json</span></h3>`);
      const nap = P.nap;
      const napRows = [['Name', nap.name], ['Address', nap.address || ''], ['Service areas', nap.service_areas ? nap.service_areas.join('\n') : ''], ['Phone', nap.phone], ['Website', nap.website], ['Email', nap.email], ['Hours', nap.hours]].filter(([, v]) => v);
      H.push(`<div class="field"><div class="field-head"><span class="field-name">Name, address, phone, website, email, hours</span>${copyBtn(JSON.stringify(nap, null, 2))}</div>
        ${napRows.map(([k, v]) => `<div class="field-head" style="margin-top:.4rem"><span class="field-text"><span class="field-meta">${esc(k)}</span>&nbsp; ${esc(v)}</span>${copyBtn(v)}</div>`).join('')}</div>`);
      H.push(`<h3>Internal note <span class="field-meta">note.txt</span></h3>`);
      H.push(field('Four lines for the GBP record', P.note, '', []));
      H.push(`<h3>Review templates <span class="field-meta">Appendix C of the GBP Workflow SOP</span></h3>`);
      H.push(field('C1. Review request (text after every job)', P.templates.c1, 'keeps [first name]', []));
      H.push(field('C2. Reply to a 1 to 3 star review', P.templates.c2, 'keeps [name] and [job]', [{ message: P.templates.c2_rule }]));
    }
    // Batch 2: the competitor check and duplicate finder, then the landing page signals
    const C = gbp.competitors || {}, L = gbp.landing, Dp = gbp.duplicates || { duplicates: [], marks: {} };
    const link = (u, t) => u ? `<a href="${esc(u)}" target="_blank">${esc(t || u)}</a>` : '';
    H.push(`<h3>Competitor check <span class="field-meta">SOP 2.1 and 1.3: the top five for "[primary category] [main town]", then any listing that looks like the client's own</span></h3>`);
    H.push(`<div style="display:flex;gap:.5rem;flex-wrap:wrap;align-items:center;margin-bottom:.6rem">
      <button class="btn btn-ghost" id="gbpCompRun" onclick="runCompetitors()" ${rd.ok === false ? 'disabled' : ''}>Run competitor check</button>
      ${C.latest ? `<span class="gen-date">Last run ${fmtTime(C.latest.at)} · searched "${esc(C.latest.keyword)}"${C.runs && C.runs.length > 1 ? ` · ${C.runs.length} runs` : ''}</span>` : '<span class="gen-date">Not run yet</span>'}
      ${rd.ownPlaceId ? `<span class="field-meta">own place id ${esc(rd.ownPlaceId)}</span>` : ''}
    </div>`);
    if (C.latest) {
      const cmp = C.comparison, chg = id => cmp && cmp.changes.find(x => x.place_id === id);
      H.push(`<div class="field"><div class="field-head"><span class="field-name">Top ${C.latest.competitors.length} competitors${C.reading ? ` · ${esc(C.reading.line)}` : ''}</span><span class="field-meta">competitor_service_count: ${rd.competitorCount !== null && rd.competitorCount !== undefined ? esc(rd.competitorCount) : 'not saved'} · <a href="/generate?clientId=${clientId}">edit on Client Values</a></span></div>
        <table style="width:100%;border-collapse:collapse;font-size:13px;margin-top:.4rem">
          <tr style="color:var(--muted);text-align:left"><th>Business</th><th>Places type</th><th title="Type the GBP primary category after a GMB Everywhere look; the note uses this column once half the five are filled">GBP primary (by hand)</th><th>Rating</th><th>Reviews</th><th>Change</th><th>Website</th><th>Maps</th></tr>
          ${C.latest.competitors.map(c => { const ch = chg(c.place_id); const hv = (C.hand || {})[c.place_id]; return `<tr style="border-top:1px solid var(--border)"><td style="padding:4px 6px 4px 0">${esc(c.name)}</td><td>${esc(c.primary_type || '')}</td><td><input class="hand" value="${esc(hv ? hv.gbp_primary : '')}" placeholder="e.g. Landscaper" style="width:150px;background:var(--surface2);color:var(--text);border:1px solid var(--border);border-radius:6px;padding:3px 6px;font-size:12px" onchange="setHandPrimary('${esc(c.place_id)}', this.value)"></td><td>${c.rating === null ? '' : c.rating}</td><td>${c.review_count}</td><td>${ch && ch.change !== null ? (ch.change > 0 ? '+' : '') + ch.change : ''}</td><td>${link(c.website, (c.website || '').replace(/^https?:\/\/(www\.)?/, '').replace(/\/$/, ''))}</td><td>${link(c.maps_url, 'Maps')}</td></tr>`; }).join('')}
          <tr style="border-top:1px solid var(--border);font-weight:600"><td style="padding:4px 6px 4px 0">Average</td><td></td><td></td><td>${C.latest.average.rating === null ? '' : C.latest.average.rating}</td><td>${C.latest.average.review_count}</td><td>${cmp ? ((cmp.average_change > 0 ? '+' : '') + cmp.average_change + (cmp.reviews_per_month !== null ? ` (${cmp.reviews_per_month} a month over ${cmp.days} days)` : '')) : ''}</td><td colspan="2">${cmp ? `since ${fmtTime(cmp.previous_at)}${cmp.previous_keyword !== C.latest.keyword ? ` (searched "${esc(cmp.previous_keyword)}" then)` : ''}` : ''}</td></tr>
        </table>
        ${C.latest.skipped.length ? `<details><summary>${C.latest.skipped.length} result${C.latest.skipped.length > 1 ? 's' : ''} skipped</summary><ul style="margin:.3rem 0 0 1.2rem;font-size:13px">${C.latest.skipped.map(s => `<li>${esc(s.name)}: ${esc(s.reason)}${s.maps_url ? ' · ' + link(s.maps_url, 'Maps') : ''}</li>`).join('')}</ul></details>` : ''}
      </div>`);
      H.push(`<div class="field"><div class="field-head"><span class="field-name">Possible duplicates of the client's listing</span><span class="field-meta">${Dp.at ? `searched ${Dp.queries.map(q => `"${esc(q)}"`).join(' and ')}` : ''}</span></div>
        ${Dp.duplicates.length ? Dp.duplicates.map(d => { const m = (Dp.marks || {})[d.place_id]; return `<div class="field-head" style="margin-top:.4rem"><span class="field-text">${esc(d.name)} <span class="field-meta">${esc(d.address || '')} · matched by ${esc(d.matched)}</span> ${link(d.maps_url, 'Maps')}</span>
          <span style="display:flex;gap:.4rem;align-items:center">${m ? `<span class="badge ${m.mark === 'reported' ? 'badge-ok' : 'badge-none'}">${m.mark === 'reported' ? 'Reported' : 'Ignored'} ${fmtDate(m.at)}</span>` : ''}
          <button class="copy" onclick="markDuplicate('${esc(d.place_id)}', '${m && m.mark === 'reported' ? '' : 'reported'}')">${m && m.mark === 'reported' ? 'Unmark' : 'Reported'}</button>
          <button class="copy" onclick="markDuplicate('${esc(d.place_id)}', '${m && m.mark === 'ignore' ? '' : 'ignore'}')">${m && m.mark === 'ignore' ? 'Unignore' : 'Ignore'}</button></span></div>`; }).join('') : '<div class="field-meta" style="margin-top:.3rem">None found.</div>'}
      </div>`);
    }
    // LeadSnap competitors from the baseline heatmap, beside the Places table (they cover different things)
    const LC = gbp.leadsnapCompetitors;
    if (LC && LC.competitors && LC.competitors.length) {
      H.push(`<div class="field"><div class="field-head"><span class="field-name">Top ${Math.min(5, LC.competitors.length)} by market share on the "${esc(LC.keyword)}" heatmap</span><span class="field-meta">LeadSnap, baseline ${fmtDate(LC.at)}</span></div>
        <table style="width:100%;border-collapse:collapse;font-size:13px;margin-top:.4rem">
          <tr style="color:var(--muted);text-align:left"><th>Business</th><th>Market share</th><th>Average rank</th><th>Top 3 points</th><th>Reviews</th><th>Maps</th></tr>
          ${LC.competitors.slice(0, 5).map(c => `<tr style="border-top:1px solid var(--border)"><td style="padding:4px 6px 4px 0">${esc(c.name)}</td><td>${c.market_share === null ? '' : c.market_share + '%'}</td><td>${c.average === null ? '' : c.average}</td><td>${c.top_3_points === null ? '' : c.top_3_points}</td><td>${c.review_count === null ? '' : c.review_count}</td><td>${link(c.maps_url, 'Maps')}</td></tr>`).join('')}
        </table></div>`);
    }
    // Rank scans (batch 3): the baseline, the monthly table, the schedules
    const S = gbp.scans;
    H.push(`<h3>Rank scans <span class="field-meta">SOP 1.7 baseline and 5.2 monthly, through LeadSnap; every run spends credits</span></h3>`);
    const lsOff = rd.leadsnap === false;
    const hasBaseline = S && S.scans && S.scans.some(s => s.run_type === 'baseline');
    H.push(`<div style="display:flex;gap:.5rem;flex-wrap:wrap;align-items:center;margin-bottom:.6rem">
      ${hasBaseline ? '' : `<button class="btn btn-ghost" id="gbpScanRun" onclick="previewBaseline()" ${rd.ok === false || lsOff ? 'disabled' : ''}>Run baseline scan</button>`}
      ${hasBaseline ? `<button class="btn btn-ghost" id="gbpScanFetch" onclick="fetchScans()" ${lsOff ? 'disabled' : ''}>Fetch latest scans</button>` : ''}
      ${S && S.pending ? `<button class="btn btn-ghost btn-sm" id="gbpScanRefresh" onclick="refreshScans()">Check ${S.pending} pending</button>` : ''}
      <span class="gen-date">${lsOff ? 'LeadSnap is not configured on the server' : S && S.settings ? `settings locked ${fmtDate(S.settings.locked_at || S.settings.built_at)} · ${S.settings.keywords.length} keywords · grid ${S.settings.grid_size} · radius ${S.settings.grid_radius_m} m · ${S.settings.credits_per_run} credits a run` : 'No baseline yet'}${S && S.schedules && S.schedules.last_fetch_at ? ` · last fetch ${fmtTime(S.schedules.last_fetch_at)}` : ''}</span>
    </div>`);
    if (S && S.settings) {
      const st = S.settings;
      H.push(`<div class="field"><div class="field-head"><span class="field-name">Scan settings (locked)</span><span class="field-meta">centre ${st.centre.lat.toFixed(4)}, ${st.centre.lng.toFixed(4)} from ${esc(st.centre.from)}${st.farthest ? ` · farthest town ${esc(st.farthest.name)} ${st.farthest.km} km` : ''}</span></div>
        <div class="field-text">${st.keywords.map(k => `${esc(k.keyword)} <span class="field-meta">(${esc(k.kind)}, ${esc(k.source)})</span>`).join('<br>')}</div></div>`);
    }
    if (S && S.table && S.table.length) {
      const months = [...new Set(S.table.flatMap(r => r.months.map(m => m.month)))].sort();
      H.push(`<div class="field"><div class="field-head"><span class="field-name">Top 3% by month against the baseline</span><span class="field-meta">average rank in brackets; change from the month before</span></div>
        <table style="width:100%;border-collapse:collapse;font-size:13px;margin-top:.4rem">
          <tr style="color:var(--muted);text-align:left"><th>Keyword</th>${months.map(m => `<th>${esc(m)}</th>`).join('')}</tr>
          ${S.table.map(r => `<tr style="border-top:1px solid var(--border)"><td style="padding:4px 6px 4px 0">${esc(r.keyword)}</td>${months.map(m => { const x = r.months.find(y => y.month === m); if (!x) return '<td></td>'; return `<td>${x.top_3_percentage}%${x.average !== null ? ` <span class="field-meta">(${x.average})</span>` : ''}${x.is_baseline ? ' <span class="badge badge-v20">baseline</span>' : x.change !== null ? ` <span class="${x.change < 0 ? 'flag' : 'field-meta'}" style="margin:0">${x.change > 0 ? '+' : ''}${x.change}</span>` : ''}</td>`; }).join('')}</tr>`).join('')}
        </table></div>`);
    }
    if (S && S.pending) H.push(`<div class="notice">${S.pending} heatmap${S.pending > 1 ? 's are' : ' is'} still running on LeadSnap. This page checks again every 20 seconds while it stays open.</div>`);
    if (S && S.schedules && S.schedules.items.length) {
      H.push(`<div class="field"><div class="field-head"><span class="field-name">Monthly schedules</span><span class="field-meta">schedules.json</span></div>
        ${S.schedules.items.map(i => `<div class="field-head" style="margin-top:.4rem"><span class="field-text">${esc(i.name)} <span class="field-meta">day ${esc(i.repeat_on)} · ${esc(i.status)}</span></span>
          <button class="copy" onclick="scheduleAction('${esc(i.schedule_id)}', '${i.status === 'paused' ? 'resume' : 'pause'}')">${i.status === 'paused' ? 'Resume' : 'Pause'}</button></div>`).join('')}</div>`);
    }
    // Profile verification (batch 3, SOP 3.10)
    const PC = gbp.profileCheck;
    H.push(`<h3>Profile verification <span class="field-meta">SOP 3.10: the LeadSnap location against the profile fields, services.csv and the hours</span></h3>`);
    H.push(`<div style="display:flex;gap:.5rem;flex-wrap:wrap;align-items:center;margin-bottom:.6rem">
      <button class="btn btn-ghost" id="gbpVerify" onclick="verifyProfile()" ${rd.ok === false || lsOff ? 'disabled' : ''}>Verify profile</button>
      ${PC ? `<span class="gen-date">Checked ${fmtTime(PC.at)} · ${esc(PC.location.name)} · completion ${PC.location.completion_percentage === null ? 'unknown' : PC.location.completion_percentage + '%'}${PC.location.suspension_reason ? ` · <span class="flag">suspended: ${esc(PC.location.suspension_reason)}</span>` : ''}${PC.location.has_pending_edits ? ' · pending edits on Google' : ''}</span>` : '<span class="gen-date">Not checked yet</span>'}
    </div>`);
    if (PC) {
      H.push(`<div class="field"><div class="field-head"><span class="field-name">${PC.diffs.length ? `${PC.counts.missing} missing, ${PC.counts.extra} extra, ${PC.counts.mismatch} mismatch` : 'Everything matches'}</span><span class="field-meta">services from ${esc(PC.services_source || '')}</span></div>
        ${PC.diffs.length ? `<table style="width:100%;border-collapse:collapse;font-size:13px;margin-top:.4rem"><tr style="color:var(--muted);text-align:left"><th>Area</th><th>Kind</th><th>Ours</th><th>Google</th></tr>
        ${PC.diffs.map(d => `<tr style="border-top:1px solid var(--border)"><td style="padding:4px 6px 4px 0">${esc(d.area)}</td><td><span class="badge ${d.kind === 'mismatch' ? 'badge-warn' : d.kind === 'missing' ? 'badge-warn' : 'badge-none'}">${esc(d.kind)}</span></td><td>${esc(d.ours)}</td><td>${esc(d.google)}</td></tr>`).join('')}</table>` : ''}
        ${PC.notes.length ? `<div class="flag">${PC.notes.map(esc).join('<br>')}</div>` : ''}</div>`);
    }
    H.push(`<h3>Landing page signals <span class="field-meta">SOP 2.4: the eight checks on the site's homepage</span></h3>`);
    H.push(`<div style="display:flex;gap:.5rem;flex-wrap:wrap;align-items:center;margin-bottom:.6rem">
      <button class="btn btn-ghost" id="gbpLandRun" onclick="runLandingPage()" ${rd.ok === false || !rd.siteUrl ? 'disabled' : ''}>Check landing page</button>
      ${L ? `<span class="gen-date">Last check ${fmtTime(L.at)} · ${L.passed} of ${L.of} pass · ${link(L.final_url)}</span>` : `<span class="gen-date">${rd.siteUrl ? 'Not checked yet' : 'No site URL saved'}</span>`}
    </div>`);
    if (L) H.push(`<div class="field">${L.signals.map(s => `<div class="field-head" style="margin-top:.3rem"><span class="field-text"><span class="badge ${s.pass ? 'badge-ok' : 'badge-warn'}">${s.pass ? 'pass' : 'fail'}</span> ${esc(s.label)}</span><span class="field-meta" style="max-width:55%;text-align:right">${esc(s.found)}</span></div>`).join('')}</div>`);
    // Description
    const d = steps.description;
    if (d && d.status === 'done') {
      H.push(`<h3>Description</h3>`);
      H.push(field('Business description', d.output.description, `${[...d.output.description].length} characters`, d.validation.flags));
    }
    // Services
    const s = steps.services;
    if (s && s.status === 'done') {
      const list = s.output.services;
      const cats = [...new Set(list.map(x => x.category))];
      H.push(`<h3>Services <span class="badge badge-v20">${list.length} total, ${list.filter(x => x.type === 'LOCKED').length} from the page map, ${list.filter(x => x.type === 'VARIANT').length} variants</span></h3>`);
      for (const c of cats) {
        H.push(`<div class="field"><div class="field-head"><span class="field-name">${esc(c)}</span>${copyBtn(list.filter(x => x.category === c).map(x => x.service).join('\n'))}</div><div class="field-meta">Copy gives the service names under this category, one per line</div></div>`);
        for (const x of list.filter(y => y.category === c)) {
          H.push(field(x.service, x.description, `${x.type.toLowerCase()} · ${[...x.description].length} characters${x.url ? ' · ' + x.url : ''}`, s.validation.flags.filter(f => f.field === x.service)));
        }
      }
    }
    // Products
    const p = steps.products;
    if (p && p.status === 'done') {
      H.push(`<h3>Products <span class="badge badge-v20">${p.output.products.length}</span></h3>`);
      for (const x of p.output.products) {
        H.push(`<div class="field"><div class="field-head"><span class="field-name">${esc(x.title)}</span><span style="display:flex;gap:.6rem;align-items:center"><span class="field-meta">title · ${[...x.title].length} characters · ${esc(x.category)}</span>${copyBtn(x.title)}</span></div>
          <div class="field-head" style="margin-top:.5rem"><span class="field-meta">description · ${[...x.description].length} characters</span>${copyBtn(x.description)}</div>
          <div class="field-text">${esc(x.description)}</div>
          ${x.url ? `<div class="field-head" style="margin-top:.5rem"><span class="field-text"><a href="${esc(x.url)}" target="_blank">${esc(x.url)}</a></span>${copyBtn(x.url)}</div>` : ''}
          ${p.validation.flags.filter(f => f.field === x.service).map(f => `<div class="flag">Check: ${esc(f.message)}</div>`).join('')}</div>`);
      }
    }
    if (!R) H.push(`<div class="empty">Not generated yet.</div>`);
    el.innerHTML = H.join('');
  }
  async function gbpCopy(btn, i) {
    try { await navigator.clipboard.writeText(gbpTexts[i]); btn.textContent = 'Copied'; btn.classList.add('done'); setTimeout(() => { btn.textContent = 'Copy'; btn.classList.remove('done'); }, 1500); }
    catch (e) { alert('Copy failed: ' + e.message); }
  }
  async function runGbp() {
    const btn = document.getElementById('gbpRun');
    btn.disabled = true; btn.textContent = 'Running… (a few minutes)';
    try {
      const r = await fetch(`/api/clients/${clientId}/gbp/generate`, { method: 'POST' });
      const data = await r.json();
      if (!r.ok) { alert(data.error || `HTTP ${r.status}`); await loadGbp(); return; }
      gbp = data; renderGbp();
    } catch (e) { alert('GBP run failed: ' + e.message); await loadGbp(); }
  }
  async function postGbp(path, btnId, label, body) {
    const btn = document.getElementById(btnId);
    if (btn) { btn.disabled = true; btn.textContent = label; }
    try {
      const r = await fetch(`/api/clients/${clientId}/gbp/${path}`, { method: body ? 'PUT' : 'POST', headers: body ? { 'Content-Type': 'application/json' } : {}, body: body ? JSON.stringify(body) : undefined });
      const data = await r.json();
      if (!r.ok) { alert(data.error || `HTTP ${r.status}`); await loadGbp(); return; }
      gbp = data; renderGbp();
    } catch (e) { alert('Failed: ' + e.message); await loadGbp(); }
  }
  function runCompetitors() { return postGbp('competitors', 'gbpCompRun', 'Searching…'); }
  function runLandingPage() { return postGbp('landing-page', 'gbpLandRun', 'Checking…'); }
  function markDuplicate(placeId, mark) { return postGbp(`duplicates/${encodeURIComponent(placeId)}`, null, '', { mark }); }
  function setHandPrimary(placeId, value) { return postGbp(`competitors/${encodeURIComponent(placeId)}`, null, '', { gbp_primary: value }); }
  // Rank scans (batch 3)
  async function previewBaseline() {
    const btn = document.getElementById('gbpScanRun');
    btn.disabled = true; btn.textContent = 'Working out the settings…';
    try {
      const r = await fetch(`/api/clients/${clientId}/gbp/scans/preview`, { method: 'POST' });
      const data = await r.json();
      if (!r.ok) { alert(data.error || `HTTP ${r.status}`); btn.disabled = false; btn.textContent = 'Run baseline scan'; return; }
      const s = data.settings;
      const text = `Baseline scan for ${s.client}\n\nKeywords (${s.keywords.length}):\n${s.keywords.map(k => '  ' + k.keyword).join('\n')}\n\nGrid: ${s.grid_size} x ${s.grid_size}, ${s.grid_radius_m} m between points${s.farthest ? ` (farthest town ${s.farthest.name}, ${s.farthest.km} km)` : ''}\nCentre: ${s.centre.lat.toFixed(4)}, ${s.centre.lng.toFixed(4)} from ${s.centre.from}\nPlace: ${s.place.name || s.place.google_place_id} (${s.place.how})\n\nCredit cost: ${data.credits} credits (${s.grid_size * s.grid_size} per keyword) now, and the same each month from the schedules.\n\nThe settings lock after this run (hard rule 8). Run it?`;
      if (!confirm(text)) { btn.disabled = false; btn.textContent = 'Run baseline scan'; return; }
      btn.textContent = 'Creating heatmaps…';
      const r2 = await fetch(`/api/clients/${clientId}/gbp/scans/baseline`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ confirm: true }) });
      const d2 = await r2.json();
      if (!r2.ok) { alert(d2.error || `HTTP ${r2.status}`); await loadGbp(); return; }
      gbp = d2; renderGbp(); scheduleRefresh();
    } catch (e) { alert('Failed: ' + e.message); await loadGbp(); }
  }
  let refreshTimer = null;
  function scheduleRefresh() {
    if (refreshTimer) clearTimeout(refreshTimer);
    if (!gbp || !gbp.scans || !gbp.scans.pending) return;
    refreshTimer = setTimeout(() => refreshScans(), 20000);
  }
  async function refreshScans() {
    try {
      const r = await fetch(`/api/clients/${clientId}/gbp/scans/refresh`, { method: 'POST' });
      const data = await r.json();
      if (r.ok) { gbp = data; renderGbp(); }
    } catch (e) { /* the next tick tries again */ }
    scheduleRefresh();
  }
  function fetchScans() { return postGbp('scans/fetch', 'gbpScanFetch', 'Fetching…'); }
  function scheduleAction(id, action) { return postGbp(`schedules/${encodeURIComponent(id)}/${action}`, null, ''); }
  function verifyProfile() { return postGbp('verify-profile', 'gbpVerify', 'Reading the listing…'); }
  async function clearGbp() {
    if (!confirm('Start the GBP output again? The saved description, services and products are removed.')) return;
    const r = await fetch(`/api/clients/${clientId}/gbp/clear`, { method: 'POST' });
    gbp = await r.json(); renderGbp();
  }

  load();
  loadGbp();
</script>
</body>
</html>
