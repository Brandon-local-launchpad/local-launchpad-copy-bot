<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Client — Local Launchpad</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #0f1117; --surface: #1a1d27; --surface2: #22263a;
    --accent: #6c63ff; --accent2: #5a52e0; --success: #4ade80;
    --danger: #f87171; --warning: #fbbf24; --text: #e2e8f0; --muted: #94a3b8;
    --border: #2d3148; --r: 10px; --font: 'Inter', system-ui, sans-serif;
  }
  body { background: var(--bg); color: var(--text); font-family: var(--font); min-height: 100vh; padding: 2rem; }
  a { color: var(--accent); text-decoration: none; }
  a:hover { text-decoration: underline; }
  .breadcrumb { color: var(--muted); font-size: 13px; margin-bottom: 1.5rem; }
  .breadcrumb a { color: var(--muted); }
  .breadcrumb a:hover { color: var(--text); }
  .header { display: flex; align-items: flex-start; justify-content: space-between; margin-bottom: 2rem; gap: 1rem; }
  h1 { font-size: 1.5rem; font-weight: 700; }
  .client-meta { color: var(--muted); font-size: 13px; margin-top: 4px; }
  .btn { display: inline-flex; align-items: center; gap: 6px; border: none; border-radius: var(--r); font-family: var(--font); font-size: 14px; font-weight: 600; padding: 10px 18px; cursor: pointer; transition: background 0.15s; text-decoration: none; }
  .btn-primary { background: var(--accent); color: #fff; }
  .btn-primary:hover { background: var(--accent2); }
  .btn-ghost { background: transparent; color: var(--muted); border: 1px solid var(--border); }
  .btn-ghost:hover { color: var(--text); }
  .btn-sm { padding: 6px 12px; font-size: 12px; }
  .tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--border); margin-bottom: 1.5rem; }
  .tab { padding: 8px 16px; font-size: 13px; font-weight: 600; color: var(--muted); cursor: pointer; border-bottom: 2px solid transparent; margin-bottom: -1px; transition: color 0.15s; }
  .tab:hover { color: var(--text); }
  .tab.active { color: var(--accent); border-bottom-color: var(--accent); }
  .tab-count { background: var(--surface2); border-radius: 10px; padding: 1px 7px; font-size: 11px; margin-left: 4px; }
  .page-list { display: grid; gap: .75rem; }
  .page-row { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r); padding: 1rem 1.25rem; display: flex; align-items: center; justify-content: space-between; gap: 1rem; cursor: pointer; transition: border-color 0.15s; }
  .page-row:hover { border-color: var(--accent); }
  .page-title { font-weight: 600; font-size: .9rem; }
  .page-slug { color: var(--muted); font-size: 12px; font-family: monospace; margin-top: 2px; }
  .page-actions { display: flex; gap: .5rem; align-items: center; flex-shrink: 0; }
  .badge { border-radius: 20px; padding: 3px 10px; font-size: 11px; font-weight: 700; }
  .badge-ok   { background: rgba(74,222,128,.15); color: var(--success); }
  .badge-warn { background: rgba(251,191,36,.15);  color: var(--warning); }
  .badge-none { background: var(--surface2); color: var(--muted); }
  .btn-danger-sm { background: transparent; color: var(--danger); border: 1px solid transparent; border-radius: 6px; padding: 4px 8px; font-size: 12px; cursor: pointer; font-family: var(--font); font-weight: 600; }
  .btn-danger-sm:hover { border-color: var(--danger); }
  .empty { color: var(--muted); padding: 2rem; text-align: center; }
  .gen-date { color: var(--muted); font-size: 11px; }
  .badge-v20  { background: rgba(108,99,255,.15); color: var(--accent); }
    @media (max-width: 640px) { body { padding: 1rem; } .page-row { flex-wrap: wrap; } }
  /* GBP output (23 Oct): description, services and products with a copy button per field */
  .gbp { margin-top: 2.5rem; border-top: 1px solid var(--border); padding-top: 1.5rem; }
  .gbp h2 { font-size: 1.1rem; font-weight: 700; margin-bottom: .25rem; }
  .gbp .sub { color: var(--muted); font-size: 13px; margin-bottom: 1rem; }
  .gbp .steps { display: flex; gap: .5rem; flex-wrap: wrap; margin: .75rem 0 1rem; }
  .gbp .notice { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r); padding: .75rem 1rem; font-size: 13px; margin-bottom: 1rem; }
  .gbp .notice.fail { border-color: var(--danger); }
  .gbp .notice ul { margin: .4rem 0 0 1.2rem; }
  .gbp .notice li { margin: 2px 0; }
  .gbp h3 { font-size: .95rem; font-weight: 700; margin: 1.5rem 0 .5rem; display: flex; align-items: center; gap: .6rem; }
  .gbp .field { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r); padding: .75rem 1rem; margin-bottom: .6rem; }
  .gbp .field-head { display: flex; justify-content: space-between; align-items: center; gap: .75rem; margin-bottom: .35rem; }
  .gbp .field-name { font-weight: 600; font-size: 13px; }
  .gbp .field-meta { color: var(--muted); font-size: 11px; font-family: monospace; }
  .gbp .field-text { font-size: 13px; line-height: 1.5; white-space: pre-wrap; }
  .gbp .field-text a { font-family: monospace; font-size: 12px; }
  .gbp .copy { background: var(--surface2); color: var(--text); border: 1px solid var(--border); border-radius: 6px; padding: 3px 9px; font-size: 11px; font-weight: 600; cursor: pointer; font-family: var(--font); }
  .gbp .copy:hover { border-color: var(--accent); }
  .gbp .copy.done { color: var(--success); border-color: var(--success); }
  .gbp .flag { color: var(--warning); font-size: 12px; margin-top: .35rem; }
  .gbp .files a { margin-right: 1rem; font-size: 13px; }
  .gbp details summary { cursor: pointer; color: var(--muted); font-size: 13px; margin: .5rem 0; }
</style>
</head>
<body>

<div class="breadcrumb"><a href="/clients.html">← Clients</a></div>

<div class="header">
  <div>
    <h1 id="clientName">Loading…</h1>
    <div class="client-meta" id="clientMeta"></div>
  </div>
  <div style="display:flex;gap:.5rem;flex-wrap:wrap">
    <a id="settingsLink" href="#" class="btn btn-ghost">Settings</a>
    <a id="generateLink" href="#" class="btn btn-primary">Generate Pages</a>
  </div>
</div>

<div class="tabs" id="tabs"></div>
<div class="page-list" id="pageList"></div>

<div class="gbp" id="gbp">
  <h2>Google Business Profile</h2>
  <div class="sub">The description, services and products to paste into the GBP editor. Each field has a copy button. Runs description, then services, then products; a run that stops at a step picks up from that step next time.</div>
  <div id="gbpBody"><div class="empty">Loading…</div></div>
</div>

<script>
  const params   = new URLSearchParams(location.search);
  const clientId = params.get('id');
  if (!clientId) location.href = '/clients.html';

  const PAGE_TYPE_ORDER = ['homepage','category','service','location','location-category'];
  const PAGE_TYPE_LABEL = { homepage: 'Homepage', category: 'Category', service: 'Service', location: 'Location', 'location-category': 'Location-Category' };

  let allPages = [];
  let activeType = null;

  async function load() {
    const [clientRes, pagesRes, v20Res] = await Promise.all([
      fetch(`/api/clients/${clientId}`),
      fetch(`/api/clients/${clientId}/pages`),
      fetch(`/api/clients/${clientId}/v20/homepage`).catch(() => null),
    ]);
    if (!clientRes.ok) { location.href = '/clients.html'; return; }
    const client = await clientRes.json();
    allPages = (await pagesRes.json()).pages || [];
    // v20 pages open on their own page screen (v20-page.html), listed first in their tab
    const v20 = v20Res && v20Res.ok ? await v20Res.json() : null;
    if (v20 && v20.record) {
      const r = v20.record, V = r.VALIDATION || {}, m = r.meta || {};
      allPages.unshift({ v20: true, page_type: 'homepage', page_title: 'Homepage (v20)', url_slug: '/', generated_at: m.edited_at || m.generated_at,
        edited: !!m.edited_at, block: V.block, flag: V.flag, claims: r.CLAIMS && r.CLAIMS.findings ? r.CLAIMS.findings.length - ((r.CLAIMS.accepted || []).length) : null });
    }

    document.title = `${client.name} — Local Launchpad`;
    document.getElementById('clientName').textContent = client.name;
    document.getElementById('clientMeta').textContent = `${client.trade} · Created ${fmtDate(client.created_at)}`;
    // A client made by the Fillout intake: marker, link to its onboarding record, archive
    if (client.source === 'fillout') {
      const mark = document.createElement('span');
      mark.className = 'badge ' + (client.reviewed_at ? 'badge-ok' : 'badge-warn');
      mark.style.marginLeft = '8px'; mark.style.verticalAlign = 'middle';
      mark.textContent = client.reviewed_at ? 'From Fillout' : 'From Fillout, unreviewed';
      document.getElementById('clientName').appendChild(mark);
      const actions = document.getElementById('settingsLink').parentElement;
      const rec = document.createElement('a');
      rec.className = 'btn btn-ghost'; rec.href = `/client-record.html?id=${clientId}`; rec.textContent = 'Onboarding record';
      actions.insertBefore(rec, actions.firstChild);
      const arch = document.createElement('button');
      arch.className = 'btn btn-ghost'; arch.textContent = client.archived_at ? 'Unarchive' : 'Archive';
      arch.onclick = async () => {
        if (!client.archived_at && !confirm(`Archive "${client.name}"? It leaves the Clients list; the onboarding record is kept.`)) return;
        await fetch(`/api/clients/${clientId}/${client.archived_at ? 'unarchive' : 'archive'}`, { method: 'POST' });
        location.href = client.archived_at ? location.href : '/clients.html';
      };
      actions.appendChild(arch);
    } else {
      // A client set up by hand: its record holds the hand set-up and the page map
      const actions = document.getElementById('settingsLink').parentElement;
      const rec = document.createElement('a');
      rec.className = 'btn btn-ghost'; rec.href = `/client-record.html?id=${clientId}#services`; rec.textContent = 'Set-up and page map';
      actions.insertBefore(rec, actions.firstChild);
    }
    document.getElementById('generateLink').href = `/generate?clientId=${clientId}`;
    document.getElementById('settingsLink').href = `/client-settings.html?id=${clientId}`;

    const types = PAGE_TYPE_ORDER.filter(t => allPages.some(p => p.page_type === t));
    if (!activeType || !types.includes(activeType)) activeType = types[0] || null;

    renderTabs(types);
    renderPages();
  }

  function renderTabs(types) {
    const tabs = document.getElementById('tabs');
    tabs.innerHTML = types.map(t => {
      const count = allPages.filter(p => p.page_type === t).length;
      return `<div class="tab${t === activeType ? ' active' : ''}" onclick="switchTab('${t}')">
        ${PAGE_TYPE_LABEL[t]}<span class="tab-count">${count}</span>
      </div>`;
    }).join('');
  }

  function renderPages() {
    const list = document.getElementById('pageList');
    const pages = allPages.filter(p => p.page_type === activeType);
    if (!pages.length) { list.innerHTML = '<div class="empty">No pages yet.</div>'; return; }
    list.innerHTML = pages.map(p => {
      if (p.v20) {
        // No validation badge here: the stored result can be out of date, and the page screen's dry run checks with today's rules
        const v = '';
        const c = p.claims ? `<span class="badge badge-warn">${p.claims} claim${p.claims > 1 ? 's' : ''} to accept</span>` : '';
        return `<div class="page-row" onclick="location.href='/v20-page.html?clientId=${clientId}&type=homepage'">
          <div>
            <div class="page-title">${esc(p.page_title)} <span class="badge badge-v20">v20</span></div>
            <div class="page-slug">Reader view, edit fields, claims, push to WordPress, push log</div>
          </div>
          <div class="page-actions">
            <span class="gen-date">${p.edited ? 'Edited' : 'Generated'} ${fmtDate(p.generated_at)}</span>
            ${v}${c}
          </div>
        </div>`;
      }
      const issueCount = (p.issues || []).length;
      const badge = !p.generated_at
        ? `<span class="badge badge-none">Not generated</span>`
        : issueCount > 0
          ? `<span class="badge badge-warn">${issueCount} issue${issueCount > 1 ? 's' : ''}</span>`
          : `<span class="badge badge-ok">✓ Clean</span>`;
      const genDate = p.generated_at ? `<span class="gen-date">${fmtDate(p.generated_at)}</span>` : '';
      return `<div class="page-row" onclick="openPage('${p.id}')">
        <div>
          <div class="page-title">${esc(p.page_title)}</div>
          <div class="page-slug">${esc(p.url_slug || '')}</div>
        </div>
        <div class="page-actions">
          ${genDate}
          ${badge}
          <button class="btn-danger-sm" onclick="event.stopPropagation();deletePage('${p.id}','${esc(p.page_title)}')">Delete</button>
        </div>
      </div>`;
    }).join('');
  }

  function switchTab(type) { activeType = type; renderTabs(PAGE_TYPE_ORDER.filter(t => allPages.some(p => p.page_type === t))); renderPages(); }
  function openPage(id) { location.href = `/page.html?id=${id}&clientId=${clientId}`; }

  async function deletePage(id, title) {
    if (!confirm(`Delete "${title}"? This cannot be undone.`)) return;
    await fetch(`/api/clients/${clientId}/pages/${id}`, { method: 'DELETE' });
    load();
  }

  function esc(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
  function fmtDate(s) { return new Date(s).toLocaleDateString('en-GB', { day:'numeric', month:'short', year:'numeric' }); }
  function fmtTime(s) { return new Date(s).toLocaleString('en-GB', { day:'numeric', month:'short', hour:'2-digit', minute:'2-digit' }); }

  // ── GBP output (gbp/routes.js) ──
  const GBP_STEPS = [['description', 'Description'], ['services', 'Services'], ['products', 'Products']];
  let gbp = null;
  const gbpTexts = [];   // the copy buttons' texts, by index
  async function loadGbp() {
    const r = await fetch(`/api/clients/${clientId}/gbp`).catch(() => null);
    if (!r) return;
    gbp = r.ok ? await r.json() : { error: (await r.json().catch(() => ({}))).error || `HTTP ${r.status}` };
    renderGbp();
  }
  function stepBadge(step, label) {
    const st = gbp.record && gbp.record.steps ? gbp.record.steps[step] : null;
    const cls = !st ? 'badge-none' : st.status === 'done' ? 'badge-ok' : 'badge-warn';
    const txt = !st ? 'not run' : st.status === 'done' ? `done${st.validation && st.validation.flags.length ? `, ${st.validation.flags.length} to check` : ''}` : 'failed';
    return `<span class="badge ${cls}">${label}: ${txt}</span>`;
  }
  function copyBtn(text) { gbpTexts.push(text); return `<button class="copy" onclick="gbpCopy(this, ${gbpTexts.length - 1})">Copy</button>`; }
  function field(name, text, meta, flags) {
    return `<div class="field"><div class="field-head"><span class="field-name">${esc(name)}</span><span style="display:flex;gap:.6rem;align-items:center"><span class="field-meta">${esc(meta || '')}</span>${copyBtn(text)}</span></div>
      <div class="field-text">${esc(text)}</div>${(flags || []).map(f => `<div class="flag">Check: ${esc(f.message)}</div>`).join('')}</div>`;
  }
  function renderGbp() {
    const el = document.getElementById('gbpBody');
    gbpTexts.length = 0;
    if (!gbp) return;
    if (gbp.error) { el.innerHTML = `<div class="notice fail">${esc(gbp.error)}</div>`; return; }
    const R = gbp.record, rd = gbp.readiness || {};
    const steps = (R && R.steps) || {};
    const allDone = GBP_STEPS.every(([s]) => steps[s] && steps[s].status === 'done');
    const failed = GBP_STEPS.map(([s]) => s).find(s => steps[s] && steps[s].status === 'failed');
    const H = [];
    H.push(`<div style="display:flex;gap:.5rem;flex-wrap:wrap;align-items:center">
      <button class="btn btn-primary" id="gbpRun" onclick="runGbp()" ${rd.ok === false || gbp.running ? 'disabled' : ''}>${gbp.running ? 'Running…' : allDone ? 'Generate GBP again' : R ? 'Generate GBP (resume)' : 'Generate GBP'}</button>
      ${R ? `<button class="btn btn-ghost btn-sm" onclick="clearGbp()">Start again</button>` : ''}
      ${R && R.updated_at ? `<span class="gen-date">Last run ${fmtTime(R.updated_at)}</span>` : ''}
    </div>`);
    H.push(`<div class="steps">${GBP_STEPS.map(([s, l]) => stepBadge(s, l)).join('')}</div>`);
    if (rd.error) H.push(`<div class="notice fail">${esc(rd.error)}</div>`);
    else {
      const bits = [`${rd.locked} service pages in the page map`, `services target ${rd.minServices}${rd.competitorCount !== null && rd.competitorCount !== undefined ? ` (competitors average ${rd.competitorCount})` : ' (no competitor count saved)'}`, rd.siteUrl ? `site ${rd.siteUrl}` : 'no site URL saved', `${rd.withCopy} service pages with copy`, `prices ${rd.showPrices ? 'shown' : 'hidden'}`];
      H.push(`<div class="notice">${esc(bits.join(' · '))}${(rd.flags || []).length ? `<ul>${rd.flags.map(f => `<li>${esc(f.msg)}</li>`).join('')}</ul>` : ''}</div>`);
    }
    if (failed) {
      const st = steps[failed];
      H.push(`<div class="notice fail"><strong>${esc(st.error)}</strong><ul>${st.fails.map(f => `<li>${esc(f.message)}</li>`).join('')}</ul>
        <details><summary>The model's answer</summary><pre class="field-text" style="max-height:300px;overflow:auto">${esc(st.raw || '')}</pre></details></div>`);
    }
    if (R && Object.keys(gbp.files || {}).length) H.push(`<div class="files">Files: ${Object.entries(gbp.files).map(([f, u]) => `<a href="${u}" target="_blank">${f}</a>`).join('')}</div>`);
    // Description
    const d = steps.description;
    if (d && d.status === 'done') {
      H.push(`<h3>Description</h3>`);
      H.push(field('Business description', d.output.description, `${[...d.output.description].length} characters`, d.validation.flags));
    }
    // Services
    const s = steps.services;
    if (s && s.status === 'done') {
      const list = s.output.services;
      const cats = [...new Set(list.map(x => x.category))];
      H.push(`<h3>Services <span class="badge badge-v20">${list.length} total, ${list.filter(x => x.type === 'LOCKED').length} from the page map, ${list.filter(x => x.type === 'VARIANT').length} variants</span></h3>`);
      for (const c of cats) {
        H.push(`<div class="field"><div class="field-head"><span class="field-name">${esc(c)}</span>${copyBtn(list.filter(x => x.category === c).map(x => x.service).join('\n'))}</div><div class="field-meta">Copy gives the service names under this category, one per line</div></div>`);
        for (const x of list.filter(y => y.category === c)) {
          H.push(field(x.service, x.description, `${x.type.toLowerCase()} · ${[...x.description].length} characters${x.url ? ' · ' + x.url : ''}`, s.validation.flags.filter(f => f.field === x.service)));
        }
      }
    }
    // Products
    const p = steps.products;
    if (p && p.status === 'done') {
      H.push(`<h3>Products <span class="badge badge-v20">${p.output.products.length}</span></h3>`);
      for (const x of p.output.products) {
        H.push(`<div class="field"><div class="field-head"><span class="field-name">${esc(x.title)}</span><span style="display:flex;gap:.6rem;align-items:center"><span class="field-meta">title · ${[...x.title].length} characters · ${esc(x.category)}</span>${copyBtn(x.title)}</span></div>
          <div class="field-head" style="margin-top:.5rem"><span class="field-meta">description · ${[...x.description].length} characters</span>${copyBtn(x.description)}</div>
          <div class="field-text">${esc(x.description)}</div>
          ${x.url ? `<div class="field-head" style="margin-top:.5rem"><span class="field-text"><a href="${esc(x.url)}" target="_blank">${esc(x.url)}</a></span>${copyBtn(x.url)}</div>` : ''}
          ${p.validation.flags.filter(f => f.field === x.service).map(f => `<div class="flag">Check: ${esc(f.message)}</div>`).join('')}</div>`);
      }
    }
    if (!R) H.push(`<div class="empty">Not generated yet.</div>`);
    el.innerHTML = H.join('');
  }
  async function gbpCopy(btn, i) {
    try { await navigator.clipboard.writeText(gbpTexts[i]); btn.textContent = 'Copied'; btn.classList.add('done'); setTimeout(() => { btn.textContent = 'Copy'; btn.classList.remove('done'); }, 1500); }
    catch (e) { alert('Copy failed: ' + e.message); }
  }
  async function runGbp() {
    const btn = document.getElementById('gbpRun');
    btn.disabled = true; btn.textContent = 'Running… (a few minutes)';
    try {
      const r = await fetch(`/api/clients/${clientId}/gbp/generate`, { method: 'POST' });
      const data = await r.json();
      if (!r.ok) { alert(data.error || `HTTP ${r.status}`); await loadGbp(); return; }
      gbp = data; renderGbp();
    } catch (e) { alert('GBP run failed: ' + e.message); await loadGbp(); }
  }
  async function clearGbp() {
    if (!confirm('Start the GBP output again? The saved description, services and products are removed.')) return;
    const r = await fetch(`/api/clients/${clientId}/gbp/clear`, { method: 'POST' });
    gbp = await r.json(); renderGbp();
  }

  load();
  loadGbp();
</script>
</body>
</html>
