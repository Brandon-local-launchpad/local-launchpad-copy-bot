<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Page — Local Launchpad</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #0f1117; --surface: #1a1d27; --surface2: #22263a;
    --accent: #6c63ff; --accent2: #5a52e0; --success: #4ade80;
    --danger: #f87171; --warning: #fbbf24; --text: #e2e8f0; --muted: #94a3b8;
    --border: #2d3148; --r: 10px; --font: 'Inter', system-ui, sans-serif;
  }
  body { background: var(--bg); color: var(--text); font-family: var(--font); min-height: 100vh; padding: 2rem; font-size: 14px; line-height: 1.5; }
  @media (max-width: 640px) { body { padding: 1rem; } }
  a { color: var(--accent); text-decoration: none; }
  a:hover { text-decoration: underline; }
  .breadcrumb { color: var(--muted); font-size: 13px; margin-bottom: 1.5rem; }
  .breadcrumb a { color: var(--muted); }
  .header { display: flex; align-items: flex-start; justify-content: space-between; margin-bottom: 1.25rem; gap: 1rem; flex-wrap: wrap; }
  h1 { font-size: 1.5rem; font-weight: 700; }
  .meta { color: var(--muted); font-size: 13px; margin-top: 4px; max-width: 70ch; }
  .actions { display: flex; gap: .5rem; flex-wrap: wrap; }
  .btn { display: inline-flex; align-items: center; gap: 6px; border: none; border-radius: var(--r); font-family: var(--font); font-size: 14px; font-weight: 600; padding: 9px 16px; cursor: pointer; text-decoration: none; }
  .btn:disabled { opacity: .4; cursor: not-allowed; }
  .btn-primary { background: var(--accent); color: #fff; }
  .btn-primary:hover:not(:disabled) { background: var(--accent2); text-decoration: none; }
  .btn-ghost { background: transparent; color: var(--muted); border: 1px solid var(--border); }
  .btn-ghost:hover:not(:disabled) { color: var(--text); text-decoration: none; }
  .btn-sm { padding: 5px 11px; font-size: 12px; }
  .tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--border); margin-bottom: 1.25rem; overflow-x: auto; overflow-y: hidden; }
  .tab { padding: 8px 16px; font-size: 13px; font-weight: 600; color: var(--muted); cursor: pointer; border-bottom: 2px solid transparent; margin-bottom: -1px; white-space: nowrap; background: none; border-top: 0; border-left: 0; border-right: 0; font-family: var(--font); }
  .tab:hover { color: var(--text); }
  .tab.active { color: var(--accent); border-bottom-color: var(--accent); }
  .panel { display: none; background: var(--surface); border: 1px solid var(--border); border-radius: var(--r); padding: 1.25rem; }
  .panel.active { display: block; }
  .panel p { margin-bottom: .75rem; }
  .muted { color: var(--muted); }
  .flag { color: var(--warning); }
  .error { color: var(--danger); }
  .success { color: var(--success); }
  .block { margin-top: .6rem; }
  ul { margin: .3rem 0 .3rem 1.2rem; }
  details { margin-top: .5rem; }
  summary { cursor: pointer; color: var(--muted); }
  table { width: 100%; font-size: 12px; border-collapse: collapse; margin-top: .4rem; }
  td { padding: 4px; vertical-align: top; border-top: 1px solid var(--border); }
  #pgNotice:not(:empty), #pgError { margin-bottom: 1rem; padding: 10px 12px; border-radius: 8px; background: var(--surface); border: 1px solid var(--border); }
  #pgError { display: none; color: var(--danger); border-color: rgba(248,113,113,.4); }
  .tag { font-size: 11px; padding: 1px 7px; border-radius: 8px; border: 1px solid; white-space: nowrap; }
  .tag-ok { color: var(--success); } .tag-flag { color: var(--warning); } .tag-muted { color: var(--muted); }
  .claim { display: flex; gap: 8px; align-items: flex-start; margin: 6px 0; }
  .claim input, .tick input { width: 15px; height: 15px; margin-top: 3px; accent-color: var(--accent); flex-shrink: 0; }
  .tick { display: flex; gap: 8px; align-items: flex-start; margin: 12px 0; }
  .section-title { font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 1.1rem 0 .5rem; }
  .section-title:first-child { margin-top: 0; }
  .bar { display: flex; gap: .5rem; flex-wrap: wrap; align-items: center; margin-top: .75rem; }
  .field { margin: 1rem 0; }
  .field-name { font-weight: 600; margin-bottom: 2px; }
  .field .error, .field .flag { font-size: 13px; }
  textarea.edit { width: 100%; margin-top: 6px; background: var(--bg); color: var(--text); border: 1px solid var(--border); border-radius: 8px; padding: 10px; font-family: var(--font); font-size: 14px; line-height: 1.5; resize: vertical; }
  textarea.edit:focus { outline: 2px solid var(--accent); border-color: transparent; }
  .words { font-size: 12px; margin-top: 2px; }
  .log-row { display: flex; gap: .75rem; align-items: center; padding: 8px 0; border-top: 1px solid var(--border); flex-wrap: wrap; font-size: 13px; }
  .log-row:first-child { border-top: 0; }
  .log-row .btn { margin-left: auto; }
  #readerBody { max-width: 80ch; }
  #readerBody h1, #readerBody h2 { font-size: 1.15rem; margin: 1.4rem 0 .5rem; }
  #readerBody h3 { font-size: 1rem; margin: 1.1rem 0 .4rem; }
  #readerBody h4, #readerBody h5 { font-size: .9rem; margin: .9rem 0 .3rem; color: var(--muted); }
  #readerBody p { margin-bottom: .6rem; }
  #readerBody hr { border: 0; border-top: 1px solid var(--border); margin: 1.5rem 0; }
  #readerBody .link { color: var(--accent); text-decoration: underline dotted; }
</style>
</head>
<body>

<div class="breadcrumb"><a href="/clients.html">Clients</a> / <a id="crumbClient" href="#">…</a></div>

<div class="header">
  <div>
    <h1 id="pgTitle">Loading…</h1>
    <div class="meta" id="pgMeta"></div>
  </div>
  <div class="actions">
    <a class="btn btn-ghost btn-sm" id="dlMd" href="#">Download .md</a>
    <a class="btn btn-ghost btn-sm" id="dlJson" href="#">Download .json</a>
    <a class="btn btn-ghost btn-sm" id="settingsLink" href="#">Client settings</a>
  </div>
</div>

<div id="pgNotice"></div>
<div id="pgError"></div>

<div id="pgBody">
  <div class="tabs" role="tablist">
    <button class="tab" data-tab="reader" onclick="showTab('reader')">Reader view</button>
    <button class="tab" data-tab="edit" onclick="showTab('edit')">Edit fields</button>
    <button class="tab" data-tab="push" onclick="showTab('push')">Claims and push</button>
    <button class="tab" data-tab="log" onclick="showTab('log')">Push log</button>
  </div>

  <div class="panel" id="panel-reader"><div id="readerBody"></div></div>

  <div class="panel" id="panel-edit"><div id="editBody"></div></div>

  <div class="panel" id="panel-push">
    <div class="section-title">Claims review</div>
    <div id="claimsBody"></div>
    <div class="section-title">Push to WordPress</div>
    <p id="siteLine"></p>
    <p class="muted">Drafts and staging sites only for now. The dry run checks the page again with today's rules and shows every field it would change; nothing is written.</p>
    <label class="tick"><input type="checkbox" id="reviewedTick"><span>I've read the reader view, including its FLAGs, and it's fit to push</span></label>
    <div class="bar">
      <button class="btn btn-ghost" id="dryBtn" onclick="dryRun()">Dry run</button>
      <button class="btn btn-primary" id="pushBtn" data-label="Push to WordPress" disabled onclick="push()">Push to WordPress</button>
    </div>
    <div id="dryResult" class="block"></div>
  </div>

  <div class="panel" id="panel-log"><div id="logBody"></div></div>
</div>

<script src="/js/v20-page.js"></script>
</body>
</html>
